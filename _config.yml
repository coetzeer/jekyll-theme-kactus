name: Your New Jekyll Site
title: Your New Jekyll Site
description: Blogging about stuffs
meta_description: "Your New Jekyll Site, Blogging about stuffs"

aboutPage: true

markdown: kramdown
highlighter: rouge

plugins: [jekyll-paginate]
paginate: 20
domain_name: 'http://yourblog-domain.com'
google_analytics: 'UA-XXXXXXXX-X'
disqus: false
disqus_shortname: 'your-disqus-shortname'

# Details for the RSS feed generator
url:            'https://coetzeer.github.io'
baseurl:        '/jekyll-theme-kactus'
author:         'Your Name'
authorTwitter:  'YourTwitterUsername'

permalink:       /:year/:title/
future:          true

# Podcast RSS Feed Configuration
podcast:
  title: "My Podcast"
  description: "Weekly thoughts on tech and life"
  author: "Raymond Coetzee"
  author_email: "raymond@example.com"
  language: "en-us"
  categories:
    - "Technology"
    - "Software Engineering"
  explicit: false
  image: "/jekyll-theme-kactus/assets/images/avatar.png"
  site_url: "https://coetzeer.github.io/jekyll-theme-kactus"
  feed_path: "podcast.xml"
  audio_dir: "assets/images"
  # Optional iTunes fields
  itunes:
    owner_name: "Raymond Coetzee"
    owner_email: "raymond@example.com"
    category: "Technology"
    subcategory: "Software Engineering"
    keywords: "tech, programming, ruby, jekyll"

defaults:
    -
        scope:
            path: "" # empty string for all files
            type: pages
        values:
            layout: default
    -
        scope:
            path: "" # empty string for all files
            type: posts
        values:
            layout: post
    -
        scope:
            path: ""
            type: drafts
        values:
            layout: post
