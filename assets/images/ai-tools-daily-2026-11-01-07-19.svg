<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.2"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="url(#accentGrad2)" stroke-width="2" opacity="0.15"/>
  <circle cx="1100" cy="100" r="40" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="530" r="60" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  
  <!-- Title -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Tools Daily Update</text>
  
  <!-- Date -->
  <text x="600" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e" text-anchor="middle">November 1, 2026</text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="450" y="330" width="300" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="600" y="355" fill="#58a6ff">Coding Agents • Open Source • Multi-Agent</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="300" y1="500" x2="900" y2="500" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small decorative elements at bottom -->
  <circle cx="550" cy="540" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="540" r="4" fill="#a371f7" opacity="0.6"/>
  <circle cx="650" cy="540" r="4" fill="#f78166" opacity="0.6"/>
  <circle cx="700" cy="540" r="4" fill="#3fb950" opacity="0.6"/>
</svg>