<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .label { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .arrow { fill: none; stroke: #58a6ff; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .dashed { fill: none; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowhead); }
      .accent-blue { fill: #58a6ff; }
      .accent-cyan { fill: #39c5cf; }
      .accent-violet { fill: #a371f7; }
      .accent-amber { fill: #d29922; }
      .accent-rose { fill: #f78166; }
      .accent-emerald { fill: #3fb950; }
      .accent-orange { fill: #f78166; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="520" />
  
  <!-- Header -->
  <text x="700" y="36" text-anchor="middle" class="title">This Week in AI Tools — Frontier Models, Persistent Agents, Local Runtimes</text>
  <text x="700" y="56" text-anchor="middle" class="subtitle">GPT-6 Astra (Critical tier) · K2 Horizon fully open · Grok Bot + Muse + Reflexio · Sep 3–8, 2026</text>
  
  <!-- Category: Frontier Models -->
  <rect x="40" y="85" width="310" height="180" class="panel" />
  <text x="195" y="110" text-anchor="middle" class="label" fill="#58a6ff">FRONTIER MODELS</text>
  <text x="60" y="135" class="sub">GPT-6 Astra (OpenAI)</text>
  <text x="60" y="150" class="code">Critical cyber tier · Computer use · $10/$50 API</text>
  <text x="60" y="170" class="code">ChatGPT Plus/Pro/Ent · Azure · Bedrock</text>
  <text x="60" y="190" class="sub">K2 Horizon (IFM/MBZUAI)</text>
  <text x="60" y="205" class="code">6 models 0.9B–375B · Apache 2.0</text>
  <text x="60" y="225" class="code">375B MoE (23B active) · 524k ctx</text>
  <text x="60" y="245" class="code">Weights, code, data, checkpoints, logs</text>
  
  <!-- Category: Persistent Agents (Enterprise) -->
  <rect x="380" y="85" width="320" height="180" class="panel" />
  <text x="540" y="110" text-anchor="middle" class="label" fill="#39c5cf">PERSISTENT AGENTS (ENTERPRISE)</text>
  <text x="400" y="135" class="sub">Grok Bot (xAI)</text>
  <text x="400" y="150" class="code">Cloud computer · Browser/terminal/fs</text>
  <text x="400" y="165" class="code">Workflow demo → repeat · Multi-bot chat</text>
  <text x="400" y="185" class="code">Cursor dashboard · Network/audit/Otel</text>
  <text x="400" y="205" class="code">Per-employee isolation (shared computer)</text>
  <text x="400" y="225" class="sub">Reflexio</text>
  <text x="400" y="240" class="code">Learns from prod traces · Auto-optimizes</text>
  <text x="400" y="255" class="code">36% failure ↓ · 57% tokens ↓ · 47% quality ↑</text>
  
  <!-- Category: Persistent Agents (Consumer) -->
  <rect x="730" y="85" width="310" height="180" class="panel" />
  <text x="885" y="110" text-anchor="middle" class="label" fill="#f78166">PERSISTENT AGENTS (CONSUMER)</text>
  <text x="750" y="135" class="sub">Meta Muse</text>
  <text x="750" y="150" class="code">Email, travel, shop, forms, pay</text>
  <text x="750" y="165" class="code">Sentinel gatekeeper · Credential isolation</text>
  <text x="750" y="185" class="code">Stripe Link one-time cards</text>
  <text x="750" y="205" class="code">Free · $20 Power · $100 Maximum</text>
  <text x="750" y="225" class="code">Web, iOS, Android, WhatsApp</text>
  <text x="750" y="245" class="code">US rollout Sep 8</text>
  
  <!-- Category: Coding Runtimes -->
  <rect x="1070" y="85" width="290" height="180" class="panel" />
  <text x="1215" y="110" text-anchor="middle" class="label" fill="#a371f7">CODING RUNTIMES</text>
  <text x="1090" y="135" class="sub">Airuncode</text>
  <text x="1090" y="150" class="code">Local-first multi-agent · BYOK</text>
  <text x="1090" y="165" class="code">Debate/self-heal · V-CORE Vulkan 3D</text>
  <text x="1090" y="185" class="sub">Blume</text>
  <text x="1090" y="200" class="code">Watches CC/Codex/Cursor sessions</text>
  <text x="1090" y="215" class="code">Corrections → rules/hooks/skills</text>
  <text x="1090" y="235" class="code">Free · Open source · Fully local</text>
  
  <!-- Category: Productivity / Niche -->
  <rect x="40" y="295" width="420" height="185" class="panel" />
  <text x="250" y="320" text-anchor="middle" class="label" fill="#d29922">PRODUCTIVITY / NICHE</text>
  <text x="60" y="345" class="sub">AI Toolbox 3.0 (PH #1)</text>
  <text x="60" y="360" class="code">Cross-platform search · Folders · Prompt lib</text>
  <text x="60" y="375" class="code">Bulk export · Artifact Vault · Context meter</text>
  <text x="60" y="395" class="code">Local-first · Lifetime $99 (PH code)</text>
  <text x="60" y="415" class="sub">Knockin (PH #5)</text>
  <text x="60" y="430" class="code">AI business card · Replies in your voice</text>
  <text x="60" y="445" class="code">Booking · Follow-up context · QR/link</text>
  <text x="60" y="465" class="sub">Clipnote / AstraBlender</text>
  <text x="60" y="480" class="code">Chat persistence MCP · Blender via cloud/OSS</text>
  
  <!-- What I'm Watching -->
  <rect x="490" y="295" width="420" height="185" class="panel" />
  <text x="700" y="320" text-anchor="middle" class="label" fill="#f78166">WATCHING THIS WEEK</text>
  <text x="510" y="345" class="code">1. Persistent agent split: enterprise vs consumer vs optimization</text>
  <text x="510" y="365" class="code">2. Coding runtime split: heavy multi-agent vs lightweight extractor</text>
  <text x="510" y="385" class="code">3. K2 Horizon transparency → more benchmark honesty?</text>
  <text x="510" y="405" class="code">4. GPT-6 Critical tier + computer use at consumer scale</text>
  <text x="510" y="425" class="code">5. Product Hunt as launchpad for agent tooling</text>
  <text x="510" y="445" class="code">6. Local-first momentum (Airuncode, Blume, AstraBlender)</text>
  
  <!-- Model split summary -->
  <rect x="940" y="295" width="420" height="185" class="panel" />
  <text x="1150" y="320" text-anchor="middle" class="label" fill="#3fb950">MODEL SPLIT THIS WEEK</text>
  <text x="960" y="345" class="sub">Open (Apache 2.0 / MIT)</text>
  <text x="960" y="365" class="code">K2 Horizon (6 models) · Blume · AstraBlender</text>
  <text x="960" y="385" class="sub">Commercial (Closed / SaaS)</text>
  <text x="960" y="405" class="code">GPT-6 Astra · Grok Bot · Meta Muse · Reflexio</text>
  <text x="960" y="425" class="code">Airuncode · AI Toolbox 3.0 · Knockin · Clipnote</text>
  <text x="960" y="445" class="code">8 commercial · 3 open · 11 total new</text>
  <text x="960" y="465" class="code">Product Hunt dominated launches (6/11)</text>
  
  <!-- Legend -->
  <rect x="40" y="490" width="1320" height="25" class="panel" />
  <text x="60" y="508" class="sub">■ Frontier Models (Blue)</text>
  <text x="250" y="508" class="sub">■ Persistent Enterprise (Cyan)</text>
  <text x="460" y="508" class="sub">■ Persistent Consumer (Coral)</text>
  <text x="660" y="508" class="sub">■ Coding Runtimes (Violet)</text>
  <text x="840" y="508" class="sub">■ Productivity/Niche (Amber)</text>
  <text x="1050" y="508" class="sub">■ Watchlist (Coral)</text>
  <text x="1200" y="508" class="sub">■ Model Split (Emerald)</text>
</svg>