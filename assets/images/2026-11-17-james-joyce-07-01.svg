<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric decoration -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <circle cx="1150" cy="80" r="60" fill="none" stroke="#30363d" stroke-width="1" opacity="0.15"/>
  
  <!-- Decorative line -->
  <line x1="200" y1="300" x2="1000" y2="300" stroke="url(#accentLine)" stroke-width="1"/>
  
  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Light Fails Differently in November
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    James Joyce · Daily Observations
  </text>
  
  <!-- Date -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6e7681" text-anchor="middle">
    17 November 2026
  </text>
  
  <!-- Small decorative elements -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="300" cy="200" r="2"/>
    <circle cx="900" cy="430" r="1.5"/>
    <circle cx="400" cy="480" r="1"/>
    <circle cx="800" cy="150" r="2.5"/>
    <circle cx="550" cy="520" r="1.5"/>
    <circle cx="650" cy="520" r="1"/>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="450" x2="800" y2="450" stroke="#30363d" stroke-width="1"/>
</svg>