<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>
  <circle cx="1100" cy="530" r="80" fill="none" stroke="url(#accentGradient2)" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="530" r="40" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="100" r="40" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.3"/>
  
  <!-- Title area -->
  <g transform="translate(120, 180)">
    <!-- Category badge -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e">AI TOOLS DAILY</text>
    
    <!-- Main title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" line-height="1.1">
      <tspan x="0" dy="0">Seven new coding agents</tspan>
      <tspan x="0" dy="60">landed this week</tspan>
    </text>
    
    <!-- Date -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">November 13, 2026</text>
    
    <!-- Decorative line -->
    <line x1="0" y1="220" x2="200" y2="220" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Right side - tool icons/labels -->
  <g transform="translate(700, 180)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g opacity="0.7">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#58a6ff">Vera</text>
    </g>
    <g opacity="0.7" transform="translate(0, 50)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#a371f7" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#a371f7">OASIS 1.0</text>
    </g>
    <g opacity="0.7" transform="translate(0, 100)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#f78166" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f78166">Qwen Code</text>
    </g>
    <g opacity="0.7" transform="translate(0, 150)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#3fb950">Agent8088</text>
    </g>
    <g opacity="0.7" transform="translate(0, 200)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#58a6ff">Open WebUI</text>
    </g>
    <g opacity="0.7" transform="translate(0, 250)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#a371f7" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#a371f7">DeepSeek SA</text>
    </g>
    <g opacity="0.7" transform="translate(0, 300)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#21262d" stroke="#f78166" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f78166">FreeToken</text>
    </g>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#accentGradient)" opacity="0.3"/>
</svg>