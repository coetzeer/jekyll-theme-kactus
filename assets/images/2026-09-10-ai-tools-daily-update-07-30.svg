<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative accent shapes -->
  <circle cx="150" cy="150" r="80" fill="url(#accentGrad)" opacity="0.08"/>
  <circle cx="1050" cy="480" r="120" fill="url(#accentGrad2)" opacity="0.06"/>
  <rect x="50" y="450" width="4" height="120" fill="#58a6ff" opacity="0.3" rx="2"/>
  <rect x="1150" y="80" width="4" height="80" fill="#a371f7" opacity="0.3" rx="2"/>
  
  <!-- Title area -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">This Week in AI Tools</text>
  
  <!-- Date -->
  <text x="600" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">September 10, 2026</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">11 new tools · Security agents · Coding orchestration · No-code builders</text>
  
  <!-- Category pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#30363d">
    <rect x="400" y="400" width="140" height="32" rx="16" fill="#1f6feb" opacity="0.2"/>
    <text x="470" y="422" fill="#58a6ff" text-anchor="middle" font-weight="600">Security</text>
    
    <rect x="560" y="400" width="160" height="32" rx="16" fill="#a371f7" opacity="0.2"/>
    <text x="640" y="422" fill="#a371f7" text-anchor="middle" font-weight="600">Coding Agents</text>
    
    <rect x="740" y="400" width="140" height="32" rx="16" fill="#f78166" opacity="0.2"/>
    <text x="810" y="422" fill="#f78166" text-anchor="middle" font-weight="600">No-Code</text>
    
    <rect x="900" y="400" width="120" height="32" rx="16" fill="#3fb950" opacity="0.2"/>
    <text x="960" y="422" fill="#3fb950" text-anchor="middle" font-weight="600">Open Source</text>
  </g>
  
  <!-- Divider line -->
  <line x1="400" y1="460" x2="800" y2="460" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Source line -->
  <text x="600" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58" text-anchor="middle">Product Hunt · CrowdStrike · Proofpoint · GitHub · Microsoft Research · Reddit</text>
  
  <!-- Bottom accent -->
  <rect x="550" y="550" width="100" height="3" fill="url(#accentGrad)" rx="1.5"/>
</svg>