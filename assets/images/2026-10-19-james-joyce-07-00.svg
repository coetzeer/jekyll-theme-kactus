<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="70%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle glow -->
  <ellipse cx="600" cy="200" rx="400" ry="150" fill="url(#glow)"/>

  <!-- Decorative lines -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="10,20"/>
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#30363d" stroke-width="1" stroke-dasharray="10,20"/>

  <!-- Small geometric accents -->
  <circle cx="150" cy="150" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="1050" cy="150" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="150" cy="480" r="2" fill="#f78166" opacity="0.6"/>
  <circle cx="1050" cy="480" r="3" fill="#3fb950" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">The Weight of October Light</text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3">James Joyce · Daily Observations</text>

  <!-- Date -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="middle">19 October 2026 · Dublin</text>

  <!-- Bottom accent line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="url(#accentGradient)" stroke-width="2"/>
</svg>