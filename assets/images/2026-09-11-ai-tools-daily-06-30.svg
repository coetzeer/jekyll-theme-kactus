<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="500" r="40" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.2"/>
  <circle cx="900" cy="100" r="60" fill="none" stroke="#f78166" stroke-width="1" opacity="0.15"/>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">
    AI Tools Daily
  </text>

  <!-- Date/Category line -->
  <text x="600" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    September 11, 2026  •  4 new launches
  </text>

  <!-- Divider line -->
  <line x1="450" y1="320" x2="750" y2="320" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Subtitle/description -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9" opacity="0.9">
    OpenAI Finance Workspace  •  TypeScript Agents SDK  •  DeepSeek V4.1 Flash  •  Workspace Agents
  </text>

  <!-- Bottom accent bar -->
  <rect x="200" y="420" width="800" height="3" fill="url(#accentGrad2)" opacity="0.6" rx="1.5"/>

  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">
    <text x="600" y="465" text-anchor="middle">
      <tspan fill="#58a6ff">●</tspan> openai
      <tspan dx="20" fill="#a371f7">●</tspan> deepseek
      <tspan dx="20" fill="#f78166">●</tspan> agents
      <tspan dx="20" fill="#3fb950">●</tspan> typescript
    </text>
  </g>

  <!-- Footer attribution -->
  <text x="600" y="590" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58">
    coetzeer.github.io/jekyll-theme-kactus
  </text>
</svg>