<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle geometric shapes - circles suggesting droplets/steam -->
  <circle cx="150" cy="120" r="2" fill="#30363d" opacity="0.6"/>
  <circle cx="200" cy="180" r="1.5" fill="#30363d" opacity="0.4"/>
  <circle cx="180" cy="80" r="1" fill="#30363d" opacity="0.5"/>
  <circle cx="1050" cy="450" r="3" fill="#30363d" opacity="0.5"/>
  <circle cx="1100" cy="500" r="2" fill="#30363d" opacity="0.4"/>
  <circle cx="1080" cy="550" r="1.5" fill="#30363d" opacity="0.3"/>
  <circle cx="300" cy="500" r="2.5" fill="#30363d" opacity="0.4"/>
  <circle cx="950" cy="100" r="1.5" fill="#30363d" opacity="0.5"/>

  <!-- Rain streaks -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="105" y2="40"/>
    <line x1="200" y1="0" x2="205" y2="40"/>
    <line x1="350" y1="0" x2="355" y2="40"/>
    <line x1="500" y1="0" x2="505" y2="40"/>
    <line x1="650" y1="0" x2="655" y2="40"/>
    <line x1="800" y1="0" x2="805" y2="40"/>
    <line x1="950" y1="0" x2="955" y2="40"/>
    <line x1="1100" y1="0" x2="1105" y2="40"/>
    <line x1="150" y1="0" x2="155" y2="40"/>
    <line x1="400" y1="0" x2="405" y2="40"/>
    <line x1="550" y1="0" x2="555" y2="40"/>
    <line x1="700" y1="0" x2="705" y2="40"/>
    <line x1="850" y1="0" x2="855" y2="40"/>
    <line x1="1000" y1="0" x2="1005" y2="40"/>
  </g>

  <!-- Horizontal accent line -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    The Light Falls Differently
  </text>

  <!-- Subtitle -->
  <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">
    on a Friday
  </text>

  <!-- Date/Category -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle" opacity="0.8">
    25 September 2026  ·  James Joyce  ·  Daily Observations
  </text>

  <!-- Bottom decorative element - suggestion of a window/spire -->
  <g stroke="#30363d" stroke-width="1" fill="none">
    <rect x="550" y="400" width="100" height="140" rx="2"/>
    <line x1="600" y1="400" x2="600" y2="540" stroke="#30363d" stroke-width="0.5"/>
    <line x1="550" y1="450" x2="650" y2="450" stroke="#30363d" stroke-width="0.5"/>
    <line x1="550" y1="500" x2="650" y2="500" stroke="#30363d" stroke-width="0.5"/>
    <!-- Spire suggestion -->
    <polygon points="600,380 595,400 605,400" fill="#30363d" opacity="0.4"/>
  </g>

  <!-- Small accent dots -->
  <circle cx="580" cy="425" r="1.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="620" cy="425" r="1.5" fill="#a371f7" opacity="0.5"/>
  <circle cx="580" cy="475" r="1.5" fill="#f78166" opacity="0.5"/>
  <circle cx="620" cy="475" r="1.5" fill="#3fb950" opacity="0.5"/>

  <!-- Signature line -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#30363d" text-anchor="middle" font-style="italic">
    coetzeer.github.io/jekyll-theme-kactus
  </text>
</svg>