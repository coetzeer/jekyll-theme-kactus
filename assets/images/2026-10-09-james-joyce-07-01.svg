<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dripGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Rain/drizzle effect - vertical lines -->
  <g stroke="url(#dripGradient)" stroke-width="1.5" opacity="0.7">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>
  </g>
  
  <!-- Accent line across middle -->
  <line x1="150" y1="315" x2="1050" y2="315" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small geometric accents -->
  <circle cx="150" cy="315" r="4" fill="#58a6ff" opacity="0.8"/>
  <circle cx="1050" cy="315" r="4" fill="#f78166" opacity="0.8"/>
  <rect x="590" y="307" width="20" height="20" fill="none" stroke="#a371f7" stroke-width="1.5" opacity="0.6" transform="rotate(45 600 317)"/>
  
  <!-- Title text -->
  <text x="600" y="250" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.5px">
    The Drizzle Remembers
  </text>
  
  <text x="600" y="300" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.5px">
    What the Sun Forgets
  </text>
  
  <!-- Subtitle/category -->
  <text x="600" y="380" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" 
        fill="#8b949e" 
        text-anchor="middle"
        letter-spacing="1px">
    JAMES JOYCE  •  DAILY OBSERVATIONS
  </text>
  
  <!-- Date -->
  <text x="600" y="420" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" 
        fill="#6e7681" 
        text-anchor="middle">
    9 October 2026  •  Dublin
  </text>
  
  <!-- Bottom accent waves -->
  <g fill="none" stroke="#30363d" stroke-width="1" opacity="0.4">
    <path d="M 100 550 Q 200 520 300 550 Q 400 580 500 550 Q 600 520 700 550 Q 800 580 900 550 Q 1000 520 1100 550"/>
    <path d="M 100 580 Q 200 550 300 580 Q 400 610 500 580 Q 600 550 700 580 Q 800 610 900 580 Q 1000 550 1100 580"/>
  </g>
</svg>