<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#58a6ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.2" />
      <stop offset="70%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="180" rx="400" ry="150" fill="url(#glowGradient)"/>
  
  <!-- Light beams - subtle vertical lines suggesting morning light -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="0" x2="200" y2="630" stroke-dasharray="20,40"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke-dasharray="15,35"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke-dasharray="25,45"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke-dasharray="18,38"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke-dasharray="22,42"/>
  </g>
  
  <!-- Horizontal light bands -->
  <g stroke="#58a6ff" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>
  
  <!-- Geometric accent shapes -->
  <circle cx="150" cy="150" r="60" stroke="#30363d" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="1050" cy="480" r="40" stroke="#30363d" stroke-width="1" fill="none" opacity="0.3"/>
  <rect x="50" y="500" width="80" height="2" fill="#30363d" opacity="0.4"/>
  <rect x="1070" y="80" width="60" height="1" fill="#30363d" opacity="0.3"/>
  
  <!-- Title -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.5px">
    The Light on Grafton Street
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="335" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" 
        fill="#8b949e" 
        text-anchor="middle"
        letter-spacing="0.3px">
    at Eleven Degrees
  </text>
  
  <!-- Date/category line -->
  <text x="600" y="390" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" 
        fill="#58a6ff" 
        text-anchor="middle"
        opacity="0.8">
    September 28, 2026  •  James Joyce
  </text>
  
  <!-- Decorative divider -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="500" y1="420" x2="700" y2="420"/>
    <circle cx="600" cy="420" r="3" fill="#58a6ff"/>
  </g>
  
  <!-- Small weather note -->
  <text x="600" y="455" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="14" 
        fill="#8b949e" 
        text-anchor="middle"
        opacity="0.7">
    Dublin  •  11°C  •  Clear Sky  •  5 km/h
  </text>
</svg>