<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>
  
  <!-- Top decorative line -->
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#30363d" stroke-width="1"/>
  
  <!-- Bottom decorative line -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#30363d" stroke-width="1"/>
  
  <!-- Left accent bar -->
  <rect x="100" y="140" width="4" height="350" fill="url(#accentGradient)"/>
  
  <!-- Right accent bar -->
  <rect x="1096" y="140" width="4" height="350" fill="url(#accentGradient)" transform="rotate(180 1098 315)"/>
  
  <!-- Title -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="url(#titleGradient)" 
        text-anchor="middle"
        dominant-baseline="middle">
    The Light Fails Differently Now
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="350" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" 
        fill="#8b949e" 
        text-anchor="middle"
        dominant-baseline="middle">
    A Dublin Wednesday
  </text>
  
  <!-- Date line -->
  <text x="600" y="395" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" 
        fill="#58a6ff" 
        text-anchor="middle"
        dominant-baseline="middle">
    16 September 2026 · 07:00 CEST
  </text>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="100" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="220" cy="85" r="1.5" fill="#a371f7" opacity="0.5"/>
  <circle cx="185" cy="115" r="1" fill="#58a6ff" opacity="0.4"/>
  
  <circle cx="1000" cy="530" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="1020" cy="545" r="1.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="1015" cy="515" r="1" fill="#a371f7" opacity="0.4"/>
  
  <circle cx="950" cy="100" r="1.5" fill="#3fb950" opacity="0.5"/>
  <circle cx="250" cy="530" r="1.5" fill="#f78166" opacity="0.5"/>
  
  <!-- Category tags -->
  <text x="600" y="450" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="14" 
        fill="#484f58" 
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="2">
    james-joyce  ·  daily-observations
  </text>
  
  <!-- Bottom accent wave -->
  <path d="M100,550 Q300,530 600,550 T1100,550" 
        fill="none" 
        stroke="#30363d" 
        stroke-width="1" 
        stroke-dasharray="10,5"/>
  
  <!-- Rain drop motifs -->
  <g fill="#58a6ff" opacity="0.3">
    <ellipse cx="150" cy="200" rx="3" ry="8" transform="rotate(-15 150 200)"/>
    <ellipse cx="1050" cy="430" rx="3" ry="8" transform="rotate(15 1050 430)"/>
    <ellipse cx="300" cy="480" rx="2.5" ry="6" transform="rotate(-10 300 480)"/>
    <ellipse cx="900" cy="150" rx="2.5" ry="6" transform="rotate(10 900 150)"/>
    <ellipse cx="500" cy="100" rx="2" ry="5" transform="rotate(-5 500 100)"/>
    <ellipse cx="700" cy="580" rx="2" ry="5" transform="rotate(5 700 580)"/>
  </g>
</svg>