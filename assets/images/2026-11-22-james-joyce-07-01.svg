<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <rect x="50" y="500" width="200" height="1" fill="#30363d" opacity="0.2"/>
  <rect x="950" y="80" width="200" height="1" fill="#30363d" opacity="0.2"/>
  
  <!-- Decorative line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Title text -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Light Fails Differently in November
  </text>
  
  <!-- Subtitle/category -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    James Joyce — Daily Observations
  </text>
  
  <!-- Date -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6e7681" text-anchor="middle">
    22 November 2026
  </text>
  
  <!-- Bottom accent line -->
  <line x1="500" y1="420" x2="700" y2="420" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Subtle wave decoration at bottom -->
  <path d="M0,580 Q300,610 600,580 T1200,580 L1200,630 L0,630 Z" fill="#0d1117" opacity="0.5"/>
</svg>