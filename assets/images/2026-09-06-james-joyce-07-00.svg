<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric pattern -->
  <g opacity="0.03" fill="none" stroke="#58a6ff" stroke-width="0.5">
    <circle cx="200" cy="150" r="80"/>
    <circle cx="1000" cy="480" r="120"/>
    <circle cx="600" cy="315" r="200"/>
  </g>
  
  <!-- Rain-like vertical lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="0" x2="105" y2="630"/>
    <line x1="250" y1="0" x2="258" y2="630"/>
    <line x1="400" y1="0" x2="405" y2="630"/>
    <line x1="550" y1="0" x2="552" y2="630"/>
    <line x1="700" y1="0" x2="708" y2="630"/>
    <line x1="850" y1="0" x2="855" y2="630"/>
    <line x1="1000" y1="0" x2="1002" y2="630"/>
    <line x1="1150" y1="0" x2="1158" y2="630"/>
  </g>
  
  <!-- Accent line -->
  <line x1="120" y1="200" x2="1080" y2="200" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="700" 
        fill="url(#textGradient)" 
        text-anchor="middle"
        filter="url(#glow)">
    The Rain Remembers What We Forget
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" 
        fill="#8b949e" 
        text-anchor="middle">
    Dublin • 17.2°C • Slight Rain • 6 September 2026
  </text>
  
  <!-- Category tag -->
  <text x="600" y="385" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" 
        fill="#58a6ff" 
        text-anchor="middle"
        font-weight="500">
    JAMES JOYCE • DAILY OBSERVATIONS
  </text>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="430" x2="800" y2="430" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Small decorative elements -->
  <circle cx="550" cy="430" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="650" cy="430" r="3" fill="#a371f7" opacity="0.6"/>
  <circle cx="600" cy="430" r="3" fill="#f78166" opacity="0.6"/>
</svg>