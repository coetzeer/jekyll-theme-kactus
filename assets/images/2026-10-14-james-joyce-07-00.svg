<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.12" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  <rect width="1200" height="630" fill="url(#lightGradient)"/>

  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="180" rx="500" ry="200" fill="url(#glowGradient)"/>

  <!-- Decorative geometric elements - subtle lines suggesting street/horizon -->
  <g stroke="#30363d" stroke-width="1" opacity="0.4">
    <line x1="100" y1="480" x2="1100" y2="480"/>
    <line x1="150" y1="500" x2="1050" y2="500" stroke-dasharray="8,12"/>
    <line x1="200" y1="520" x2="1000" y2="520" stroke-dasharray="4,20"/>
  </g>

  <!-- Vertical light shafts suggesting morning light through buildings -->
  <g opacity="0.15">
    <rect x="200" y="100" width="3" height="380" fill="#58a6ff"/>
    <rect x="400" y="120" width="2" height="360" fill="#a371f7"/>
    <rect x="600" y="80" width="4" height="400" fill="#ffffff"/>
    <rect x="800" y="110" width="2" height="370" fill="#f78166"/>
    <rect x="1000" y="130" width="3" height="350" fill="#3fb950"/>
  </g>

  <!-- Fallen leaves / autumn particles -->
  <g fill="#f78166" opacity="0.6">
    <ellipse cx="180" cy="520" rx="4" ry="2" transform="rotate(-15 180 520)"/>
    <ellipse cx="350" cy="540" rx="3" ry="1.5" transform="rotate(22 350 540)"/>
    <ellipse cx="520" cy="510" rx="5" ry="2.5" transform="rotate(-8 520 510)"/>
    <ellipse cx="780" cy="530" rx="3" ry="1.5" transform="rotate(30 780 530)"/>
    <ellipse cx="950" cy="500" rx="4" ry="2" transform="rotate(-20 950 500)"/>
    <ellipse cx="1050" cy="550" rx="2" ry="1" transform="rotate(12 1050 550)"/>
  </g>

  <!-- Title text -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)">The Light on Grafton Street</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">and Other Ordinary Miracles</text>

  <!-- Date line -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">October 14, 2026 · 12.5°C · Mainly Clear</text>

  <!-- Decorative separator -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="500" y1="395" x2="700" y2="395"/>
    <circle cx="600" cy="395" r="3" fill="#58a6ff"/>
  </g>

  <!-- Category tag -->
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58a6ff" letter-spacing="2">JAMES JOYCE · DAILY OBSERVATIONS</text>

  <!-- Bottom accent line -->
  <line x1="300" y1="580" x2="900" y2="580" stroke="#30363d" stroke-width="1" opacity="0.5"/>
</svg>