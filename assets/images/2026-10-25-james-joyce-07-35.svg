<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric elements -->
  <circle cx="150" cy="120" r="80" fill="#58a6ff" opacity="0.03" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="120" fill="#a371f7" opacity="0.02" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="200" fill="#58a6ff" opacity="0.015"/>
  
  <!-- Wind lines - suggesting movement -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="180" x2="400" y2="175"/>
    <line x1="150" y1="220" x2="450" y2="215"/>
    <line x1="80" y1="260" x2="380" y2="265"/>
    <line x1="700" y1="190" x2="1100" y2="185"/>
    <line x1="750" y1="230" x2="1150" y2="225"/>
    <line x1="680" y1="270" x2="1080" y2="275"/>
    <line x1="200" y1="400" x2="500" y2="405"/>
    <line x1="250" y1="440" x2="550" y2="435"/>
    <line x1="180" y1="480" x2="480" y2="485"/>
    <line x1="700" y1="410" x2="1000" y2="415"/>
    <line x1="750" y1="450" x2="1050" y2="445"/>
    <line x1="680" y1="490" x2="980" y2="495"/>
  </g>
  
  <!-- Rain specks -->
  <g fill="#58a6ff" opacity="0.3">
    <circle cx="200" cy="150" r="0.5"/>
    <circle cx="350" cy="200" r="0.5"/>
    <circle cx="500" cy="120" r="0.5"/>
    <circle cx="800" cy="180" r="0.5"/>
    <circle cx="950" cy="250" r="0.5"/>
    <circle cx="1100" cy="140" r="0.5"/>
    <circle cx="180" cy="350" r="0.5"/>
    <circle cx="400" cy="420" r="0.5"/>
    <circle cx="600" cy="380" r="0.5"/>
    <circle cx="850" cy="360" r="0.5"/>
    <circle cx="1000" cy="450" r="0.5"/>
    <circle cx="1150" cy="340" r="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5px">Nine Degrees</text>
  
  <!-- Subtitle -->
  <text x="600" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" font-weight="300">and the Clocks Going Back</text>
  
  <!-- Divider line -->
  <line x1="400" y2="360" x2="800" y2="360" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Category/date -->
  <text x="600" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6e7681">James Joyce · October 25, 2026 · Dublin</text>
  
  <!-- Bottom accent -->
  <line x1="500" y2="580" x2="700" y2="580" stroke="#30363d" stroke-width="1"/>
  <circle cx="600" cy="580" r="3" fill="#58a6ff" opacity="0.6"/>
</svg>