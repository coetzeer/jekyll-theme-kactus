<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Decorative geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.08"/>
  
  <!-- Accent lines -->
  <line x1="100" y1="180" x2="300" y2="180" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="900" y1="450" x2="1100" y2="450" stroke="url(#accentGrad2)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small decorative squares -->
  <rect x="150" y="200" width="4" height="4" fill="#58a6ff" opacity="0.6"/>
  <rect x="170" y="200" width="4" height="4" fill="#a371f7" opacity="0.5"/>
  <rect x="190" y="200" width="4" height="4" fill="#3fb950" opacity="0.5"/>
  <rect x="1050" y="430" width="4" height="4" fill="#f78166" opacity="0.6"/>
  <rect x="1070" y="430" width="4" height="4" fill="#3fb950" opacity="0.5"/>
  <rect x="1090" y="430" width="4" height="4" fill="#58a6ff" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">AI Tools Roundup</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">What actually shipped since last time</text>
  
  <!-- Date/category -->
  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff">November 17, 2026  •  AI / Tools</text>
  
  <!-- Bottom accent -->
  <line x1="400" y1="430" x2="800" y2="430" stroke="#30363d" stroke-width="1"/>
  
  <!-- Small indicator dots -->
  <circle cx="550" cy="460" r="3" fill="#58a6ff" opacity="0.7"/>
  <circle cx="600" cy="460" r="3" fill="#a371f7" opacity="0.7"/>
  <circle cx="650" cy="460" r="3" fill="#3fb950" opacity="0.7"/>
</svg>