<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric decoration - circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1050" cy="480" r="60" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Subtle wave lines -->
  <path d="M0,400 Q300,380 600,400 T1200,400" fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>
  <path d="M0,440 Q300,460 600,440 T1200,440" fill="none" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Title area -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">The Weight of an Overcast Morning</text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.2px">James Joyce — Daily Observations</text>
  
  <!-- Date line -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">24 September 2026 · Dublin</text>
  
  <!-- Decorative line -->
  <line x1="500" y1="380" x2="700" y2="380" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Bottom accent -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#30363d" text-anchor="middle">coetzeer.github.io/jekyll-theme-kactus</text>
</svg>