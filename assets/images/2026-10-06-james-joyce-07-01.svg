<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle glow orbs -->
  <ellipse cx="240" cy="189" rx="300" ry="200" fill="url(#glow1)"/>
  <ellipse cx="960" cy="441" rx="280" ry="180" fill="url(#glow2)"/>
  
  <!-- Top accent line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#30363d" stroke-width="1" stroke-dasharray="8,4"/>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#30363d" stroke-width="1" stroke-dasharray="8,4"/>
  
  <!-- Left vertical accent -->
  <line x1="100" y1="80" x2="100" y2="550" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Right vertical accent -->
  <line x1="1100" y1="80" x2="1100" y2="550" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="100" cy="550" r="4" fill="#a371f7" opacity="0.6"/>
  <circle cx="1100" cy="80" r="4" fill="#a371f7" opacity="0.6"/>
  <circle cx="1100" cy="550" r="4" fill="#58a6ff" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)" letter-spacing="0.5">
    The Light That Falls on Tallaght
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" font-weight="400" letter-spacing="0.3">
    October 6, 2026 · Dublin · 16.3°C · Overcast
  </text>
  
  <!-- Category tag -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" font-weight="500" text-transform="uppercase" letter-spacing="2">
    james joyce · daily observations
  </text>
  
  <!-- Decorative wave at bottom -->
  <path d="M 200 450 Q 300 420 400 450 T 600 450 T 800 450 T 1000 450" 
        stroke="#30363d" stroke-width="1" fill="none" stroke-dasharray="4,6" opacity="0.5"/>
  
  <!-- Small decorative elements - scattered dots -->
  <g fill="#30363d" opacity="0.3">
    <circle cx="180" cy="150" r="1.5"/>
    <circle cx="320" cy="500" r="1"/>
    <circle cx="480" cy="180" r="1.5"/>
    <circle cx="720" cy="520" r="1"/>
    <circle cx="880" cy="160" r="1.5"/>
    <circle cx="1020" cy="480" r="1"/>
    <circle cx="150" cy="400" r="1"/>
    <circle cx="550" cy="580" r="1.5"/>
    <circle cx="950" cy="580" r="1"/>
  </g>
  
  <!-- Thin horizontal rules flanking subtitle -->
  <line x1="400" y1="335" x2="480" y2="335" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <line x1="720" y1="335" x2="800" y2="335" stroke="#30363d" stroke-width="1" opacity="0.5"/>
</svg>