<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueFade" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleFade" x1="1" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle gradient layers -->
  <rect width="1200" height="630" fill="url(#blueFade)"/>
  <rect width="1200" height="630" fill="url(#purpleFade)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="150" r="180" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <circle cx="950" cy="480" r="100" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="950" cy="480" r="160" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.25"/>

  <!-- Thin horizontal lines -->
  <line x1="60" y1="220" x2="1140" y2="220" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="430" x2="1140" y2="430" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">October Morning, Clear and Cool</text>

  <!-- Subtitle -->
  <text x="600" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="0.3">Dublin / James Joyce / 7 October 2026</text>

  <!-- Small decorative dots -->
  <circle cx="100" cy="100" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="300" cy="500" r="3" fill="#a371f7" opacity="0.4"/>
  <circle cx="1100" cy="200" r="2" fill="#f78166" opacity="0.5"/>
  <circle cx="600" cy="580" r="3" fill="#3fb950" opacity="0.3"/>
</svg>