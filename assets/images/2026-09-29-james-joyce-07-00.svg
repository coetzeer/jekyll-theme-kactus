<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#58a6ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </accentGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric light beam -->
  <ellipse cx="600" cy="100" rx="400" ry="150" fill="url(#lightGradient)"/>
  
  <!-- Faint geometric elements - suggestion of street lamps, trees -->
  <g opacity="0.15" stroke="#30363d" stroke-width="1" fill="none">
    <line x1="150" y1="500" x2="150" y2="200" stroke-dasharray="8,4"/>
    <line x1="1050" y1="500" x2="1050" y2="200" stroke-dasharray="8,4"/>
    <circle cx="150" cy="180" r="25"/>
    <circle cx="1050" cy="180" r="25"/>
    <!-- Tree suggestions -->
    <path d="M300 500 Q280 400 300 300 Q320 400 300 500"/>
    <path d="M900 500 Q880 400 900 300 Q920 400 900 500"/>
  </g>
  
  <!-- Subtle wave line suggesting the Liffey -->
  <path d="M0 520 Q300 480 600 520 Q900 560 1200 520 L1200 630 L0 630 Z" fill="#0d1117" opacity="0.6"/>
  <path d="M0 520 Q300 480 600 520 Q900 560 1200 520" fill="none" stroke="#30363d" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Light on Emmet Crescent
  </text>
  
  <!-- Subtitle line -->
  <line x1="400" y1="310" x2="800" y2="310" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Category/date text -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" font-style="italic">
    September 29, 2026 — Dublin
  </text>
  
  <!-- Small decorative element -->
  <circle cx="600" cy="400" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="580" cy="400" r="2" fill="#a371f7" opacity="0.4"/>
  <circle cx="620" cy="400" r="2" fill="#f78166" opacity="0.4"/>
  
  <!-- Author attribution -->
  <text x="600" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#484f58" text-anchor="middle">
    James Joyce · Daily Observations
  </text>
</svg>