<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6edf3;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric pattern -->
  <g stroke="#30363d" stroke-width="0.5" fill="none" opacity="0.4">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <g fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3">
    <circle cx="150" cy="150" r="80"/>
    <circle cx="1050" cy="480" r="120"/>
    <circle cx="600" cy="315" r="40"/>
  </g>
  
  <!-- Small accent circles -->
  <g fill="#58a6ff" opacity="0.6">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="1000" cy="430" r="2"/>
    <circle cx="550" cy="350" r="2"/>
    <circle cx="650" cy="280" r="1.5"/>
    <circle cx="300" cy="400" r="2.5"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)">The Heron at Dawn</text>
  
  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">August 26, 2026 · Dublin Quays</text>
  
  <!-- Decorative line -->
  <line x1="500" y1="350" x2="700" y2="350" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Category tag -->
  <text x="600" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a371f7" opacity="0.8">james-joyce · daily-observations</text>
  
  <!-- Bottom accent wave -->
  <path d="M0,580 Q300,550 600,580 T1200,580 L1200,630 L0,630 Z" fill="url(#accentGradient)" opacity="0.4"/>
</svg>