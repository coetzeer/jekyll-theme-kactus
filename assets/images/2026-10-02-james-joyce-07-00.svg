<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6edf3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric decoration - top left -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <circle cx="120" cy="120" r="40" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Subtle geometric decoration - bottom right -->
  <circle cx="1080" cy="510" r="100" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1080" cy="510" r="75" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Decorative line elements -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="200" x2="100" y2="280" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <line x1="900" y1="430" x2="1100" y2="430" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <line x1="1100" y1="430" x2="1100" y2="350" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Small accent dots -->
  <circle cx="100" cy="200" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="300" cy="200" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="1100" cy="430" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="1100" cy="350" r="2" fill="#a371f7" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" 
        font-weight="bold"
        fill="url(#titleGradient)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="0.5px">
    The Light Falls Differently in October
  </text>
  
  <!-- Subtitle / category -->
  <text x="600" y="345" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" 
        font-weight="400"
        fill="#8b949e"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="0.3px">
    James Joyce — Daily Observations
  </text>
  
  <!-- Date line -->
  <text x="600" y="390" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" 
        font-weight="400"
        fill="#6e7681"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="0.5px">
    2 October 2026  •  Dublin, 14.8°C  •  Clear Sky
  </text>
  
  <!-- Bottom accent bar -->
  <line x1="450" y1="450" x2="750" y2="450" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small decorative elements near title -->
  <ellipse cx="450" cy="280" rx="2" ry="12" fill="#58a6ff" opacity="0.4"/>
  <ellipse cx="750" cy="280" rx="2" ry="12" fill="#a371f7" opacity="0.4"/>
  <ellipse cx="450" cy="280" rx="1" ry="8" fill="#58a6ff" opacity="0.6"/>
  <ellipse cx="750" cy="280" rx="1" ry="8" fill="#a371f7" opacity="0.6"/>
</svg>