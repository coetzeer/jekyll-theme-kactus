<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Small Parts">
  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgWash)"/>

  <circle cx="1010" cy="120" r="300" fill="url(#glow2)"/>
  <circle cx="120" cy="560" r="260" fill="url(#glow)"/>

  <line x1="80" y1="96" x2="430" y2="96" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#30363d" stroke-width="1"/>

  <g fill="none" stroke="#30363d" stroke-width="1">
    <circle cx="880" cy="330" r="190"/>
    <circle cx="880" cy="330" r="140"/>
  </g>

  <circle cx="880" cy="330" r="96" fill="none" stroke="#f78166" stroke-width="2" stroke-opacity="0.75"/>

  <g fill="#58a6ff">
    <circle cx="755" cy="222" r="9" fill-opacity="0.9"/>
    <circle cx="1012" cy="284" r="6" fill-opacity="0.55"/>
    <circle cx="940" cy="452" r="11" fill-opacity="0.75"/>
    <circle cx="806" cy="430" r="5" fill-opacity="0.45"/>
    <circle cx="1048" cy="404" r="7" fill-opacity="0.6"/>
  </g>
  <g fill="#a371f7">
    <circle cx="856" cy="212" r="5" fill-opacity="0.7"/>
    <circle cx="762" cy="330" r="7" fill-opacity="0.5"/>
    <circle cx="1000" cy="352" r="4" fill-opacity="0.6"/>
  </g>
  <g fill="#3fb950">
    <circle cx="900" cy="470" r="5" fill-opacity="0.65"/>
    <circle cx="960" cy="196" r="4" fill-opacity="0.5"/>
  </g>
  <g fill="#f78166">
    <circle cx="838" cy="368" r="6" fill-opacity="0.8"/>
  </g>

  <g fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.45">
    <circle cx="1112" cy="150" r="4"/>
    <circle cx="1090" cy="182" r="3"/>
    <circle cx="1128" cy="196" r="3"/>
  </g>

  <text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#8b949e">DUBLIN · SATURDAY</text>

  <text x="80" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">Small Parts</text>

  <text x="80" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Seven degrees and a clear sky, and a morning that will not stop</text>
  <text x="80" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">coming apart into pieces you could swallow.</text>

  <text x="80" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e" letter-spacing="1">17 OCTOBER 2026</text>
  <text x="1120" y="566" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e" letter-spacing="1">JAMES JOYCE</text>
</svg>
