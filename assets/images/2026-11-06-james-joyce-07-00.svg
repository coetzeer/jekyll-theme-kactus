<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="lightGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="180" rx="500" ry="200" fill="url(#lightGradient)"/>
  
  <!-- River suggestion at bottom -->
  <path d="M0,500 Q300,520 600,500 Q900,480 1200,500 L1200,630 L0,630 Z" fill="#0d1117" opacity="0.6"/>
  <path d="M0,500 Q300,520 600,500 Q900,480 1200,500" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Distant city silhouette -->
  <path d="M100,480 L100,420 L150,420 L150,400 L200,400 L200,430 L250,430 L250,390 L300,390 L300,440 L350,440 L350,410 L400,410 L400,450 L450,450 L450,380 L500,380 L500,420 L550,420 L550,370 L600,370 L600,410 L650,410 L650,360 L700,360 L700,400 L750,400 L750,430 L800,430 L800,390 L850,390 L850,440 L900,440 L900,410 L950,410 L950,420 L1000,420 L1000,400 L1050,400 L1050,430 L1100,430 L1100,480 Z" fill="#161b22" opacity="0.7"/>
  
  <!-- Light reflections on water -->
  <g opacity="0.4">
    <line x1="200" y1="520" x2="220" y2="520" stroke="#58a6ff" stroke-width="1"/>
    <line x1="400" y1="535" x2="425" y2="535" stroke="#58a6ff" stroke-width="1"/>
    <line x1="650" y1="515" x2="680" y2="515" stroke="#a371f7" stroke-width="1"/>
    <line x1="850" y1="530" x2="875" y2="530" stroke="#f78166" stroke-width="1"/>
    <line x1="1000" y1="525" x2="1020" y2="525" stroke="#58a6ff" stroke-width="1"/>
  </g>
  
  <!-- Decorative geometric elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#30363d" stroke-width="0.3" opacity="0.2"/>
  <circle cx="1050" cy="500" r="60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1050" cy="500" r="90" fill="none" stroke="#30363d" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Thin horizontal accent lines -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="url(#accentGradient)" stroke-width="1" opacity="0.5"/>
  <line x1="900" y1="350" x2="1100" y2="350" stroke="url(#accentGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">The Light Fails Differently Now</text>
  
  <!-- Subtitle/date -->
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle" letter-spacing="0.3">Dublin · November 6, 2026 · James Joyce</text>
  
  <!-- Category tags -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle" opacity="0.8">Daily Observations · The City · Memory</text>
  
  <!-- Bottom decorative line -->
  <line x1="500" y1="400" x2="700" y2="400" stroke="#30363d" stroke-width="1"/>
  <circle cx="600" cy="400" r="3" fill="#58a6ff" opacity="0.6"/>
</svg>