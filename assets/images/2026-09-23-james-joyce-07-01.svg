<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.15"/>

  <!-- Accent line -->
  <line x1="150" y1="280" x2="1050" y2="280" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="0.5">The Weight of Grey Light</text>

  <!-- Subtitle/category -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">James Joyce — Daily Observations</text>

  <!-- Date -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="middle">23 September 2026 · Dublin · 16.3°C Overcast</text>

  <!-- Bottom accent elements -->
  <circle cx="300" cy="580" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="320" cy="580" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="900" cy="580" r="3" fill="#f78166" opacity="0.6"/>
  <circle cx="880" cy="580" r="2" fill="#3fb950" opacity="0.5"/>

  <!-- Decorative waves at bottom -->
  <path d="M0,600 Q300,570 600,600 T1200,600 L1200,630 L0,630 Z" fill="#0d1117" opacity="0.8"/>
  <path d="M0,610 Q300,585 600,610 T1200,610 L1200,630 L0,630 Z" fill="#161b22" opacity="0.6"/>
</svg>