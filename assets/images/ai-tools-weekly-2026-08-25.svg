<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accent)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="120" fill="#a371f7" opacity="0.06" filter="url(#glow)"/>
  <circle cx="200" cy="550" r="60" fill="#58a6ff" opacity="0.05" filter="url(#glow)"/>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">
    This Week in AI Tools
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#8b949e">
    August 25, 2026 · Issue #42
  </text>
  
  <!-- Divider -->
  <line x1="450" y1="300" x2="750" y2="300" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tags -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
    <rect x="480" y="320" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="530" y="342" text-anchor="middle" fill="#58a6ff">AI Agents</text>
    
    <rect x="595" y="320" width="110" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="650" y="342" text-anchor="middle" fill="#a371f7">Coding Tools</text>
    
    <rect x="720" y="320" width="90" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="765" y="342" text-anchor="middle" fill="#3fb950">Open Source</text>
  </g>
  
  <!-- Bottom stats -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6e7681">
    7 new open-source agents · 5 major platform updates · Long-running workflows rising
  </text>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#484f58">
    coetzeer.github.io/jekyll-theme-kactus  •  Weekly AI Tools Digest
  </text>
  
  <!-- Small decorative dots -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="300" cy="450" r="3"/>
    <circle cx="330" cy="450" r="2"/>
    <circle cx="360" cy="450" r="3"/>
    <circle cx="840" cy="450" r="3"/>
    <circle cx="870" cy="450" r="2"/>
    <circle cx="900" cy="450" r="3"/>
  </g>
</svg>