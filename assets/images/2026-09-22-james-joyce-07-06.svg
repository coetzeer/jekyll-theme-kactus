<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.05" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  <!-- Subtle grid pattern suggesting city streets -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="150" y1="340" x2="150" y2="420"/>
    <line x1="350" y1="340" x2="350" y2="420"/>
    <line x1="550" y1="340" x2="550" y2="420"/>
    <line x1="750" y1="340" x2="750" y2="420"/>
    <line x1="950" y1="340" x2="950" y2="420"/>
    <line x1="1150" y1="340" x2="1150" y2="420"/>
  </g>
  <!-- Georgian window silhouettes -->
  <g fill="#161b22" filter="url(#softGlow)">
    <!-- Left building -->
    <rect x="80" y="200" width="180" height="320" rx="2"/>
    <rect x="95" y="220" width="70" height="100" rx="1" fill="url(#windowGlow)"/>
    <rect x="175" y="220" width="70" height="100" rx="1" fill="#1a1f2e"/>
    <rect x="95" y="340" width="70" height="100" rx="1" fill="#1a1f2e"/>
    <rect x="175" y="340" width="70" height="100" rx="1" fill="url(#windowGlow)"/>
    <!-- Center building (library) -->
    <rect x="330" y="160" width="220" height="360" rx="2"/>
    <rect x="350" y="180" width="80" height="120" rx="1" fill="url(#windowGlow)"/>
    <rect x="450" y="180" width="80" height="120" rx="1" fill="#58a6ff" opacity="0.2"/>
    <rect x="350" y="320" width="80" height="120" rx="1" fill="#1a1f2e"/>
    <rect x="450" y="320" width="80" height="120" rx="1" fill="url(#windowGlow)"/>
    <!-- Door -->
    <rect x="415" y="470" width="50" height="50" rx="1" fill="#2d333b"/>
    <!-- Right building -->
    <rect x="620" y="220" width="160" height="300" rx="2"/>
    <rect x="635" y="240" width="60" height="90" rx="1" fill="#1a1f2e"/>
    <rect x="705" y="240" width="60" height="90" rx="1" fill="url(#windowGlow)"/>
    <rect x="635" y="350" width="60" height="90" rx="1" fill="url(#windowGlow)"/>
    <rect x="705" y="350" width="60" height="90" rx="1" fill="#1a1f2e"/>
    <!-- Far building -->
    <rect x="850" y="240" width="140" height="280" rx="2" opacity="0.6"/>
    <rect x="865" y="260" width="50" height="80" rx="1" fill="#1a1f2e" opacity="0.6"/>
    <rect x="925" y="260" width="50" height="80" rx="1" fill="url(#windowGlow)" opacity="0.6"/>
    <rect x="865" y="360" width="50" height="80" rx="1" fill="url(#windowGlow)" opacity="0.6"/>
    <rect x="925" y="360" width="50" height="80" rx="1" fill="#1a1f2e" opacity="0.6"/>
  </g>
  <!-- Overcast sky texture -->
  <g fill="#30363d" opacity="0.15">
    <ellipse cx="200" cy="100" rx="120" ry="40"/>
    <ellipse cx="500" cy="80" rx="150" ry="50"/>
    <ellipse cx="900" cy="120" rx="100" ry="35"/>
    <ellipse cx="1100" cy="60" rx="80" ry="30"/>
    <ellipse cx="50" cy="150" rx="60" ry="25"/>
  </g>
  <!-- Rain streaks -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="50" x2="95" y2="65"/>
    <line x1="200" y1="40" x2="195" y2="55"/>
    <line x1="300" y1="55" x2="295" y2="70"/>
    <line x1="400" y1="45" x2="395" y2="60"/>
    <line x1="500" y1="50" x2="495" y2="65"/>
    <line x1="600" y1="40" x2="595" y2="55"/>
    <line x1="700" y1="55" x2="695" y2="70"/>
    <line x1="800" y1="45" x2="795" y2="60"/>
    <line x1="900" y1="50" x2="895" y2="65"/>
    <line x1="1000" y1="40" x2="995" y2="55"/>
    <line x1="1100" y1="55" x2="1095" y2="70"/>
  </g>
  <!-- Title text -->
  <text x="600" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">The City Breathes</text>
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e" font-weight="400">Through Glass and Stone</text>
  <!-- Divider line -->
  <line x1="450" y1="205" x2="750" y2="205" stroke="#30363d" stroke-width="1.5"/>
  <!-- Subtitle/category -->
  <text x="600" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" font-weight="500">JAMES JOYCE · DAILY OBSERVATIONS · 22 SEPTEMBER 2026</text>
  <!-- Bottom decorative element -->
  <g stroke="#30363d" stroke-width="1" fill="none">
    <path d="M550 580 Q600 560 650 580"/>
    <circle cx="600" cy="580" r="3" fill="#58a6ff"/>
  </g>
</svg>