<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric elements - drizzle lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="0" x2="110" y2="630"/>
    <line x1="250" y1="0" x2="260" y2="630"/>
    <line x1="400" y1="0" x2="415" y2="630"/>
    <line x1="550" y1="0" x2="570" y2="630"/>
    <line x1="700" y1="0" x2="725" y2="630"/>
    <line x1="850" y1="0" x2="880" y2="630"/>
    <line x1="950" y1="0" x2="990" y2="630"/>
    <line x1="1100" y1="0" x2="1145" y2="630"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="600" cy="280" rx="400" ry="200" fill="url(#glowGradient)"/>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5px">
    The Light Drizzle Remembers Everything
  </text>

  <!-- Subtitle line -->
  <line x1="400" y1="290" x2="800" y2="290" stroke="url(#accentGradient)" stroke-width="2"/>

  <!-- Category/date -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    James Joyce · Daily Observations · 1 November 2026
  </text>

  <!-- Decorative elements - subtle circles suggesting droplets/ripples -->
  <g fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3">
    <circle cx="200" cy="150" r="30"/>
    <circle cx="200" cy="150" r="50"/>
    <circle cx="1000" cy="480" r="25"/>
    <circle cx="1000" cy="480" r="45"/>
    <circle cx="150" cy="500" r="20"/>
    <circle cx="150" cy="500" r="38"/>
    <circle cx="1050" cy="100" r="15"/>
    <circle cx="1050" cy="100" r="30"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#accentGradient)"/>
</svg>