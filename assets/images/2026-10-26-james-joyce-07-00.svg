<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <ellipse cx="240" cy="180" rx="300" ry="200" fill="url(#glow1)"/>
  <ellipse cx="960" cy="450" rx="280" ry="180" fill="url(#glow2)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Decorative line -->
  <line x1="120" y1="200" x2="1080" y2="200" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="8,4" opacity="0.4"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">The Light Falls Differently</text>
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">on a Monday</text>
  
  <!-- Subtitle -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">James Joyce · Daily Observations · October 26, 2026</text>
  
  <!-- Bottom accent line -->
  <line x1="450" y1="460" x2="750" y2="460" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small decorative circles -->
  <circle cx="550" cy="460" r="3" fill="#58a6ff" opacity="0.8"/>
  <circle cx="650" cy="460" r="3" fill="#a371f7" opacity="0.8"/>
  <circle cx="750" cy="460" r="3" fill="#f78166" opacity="0.8"/>
  
  <!-- Corner marks -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M 60 60 h 40 M 60 60 v 40"/>
    <path d="M 1140 60 h -40 M 1140 60 v 40"/>
    <path d="M 60 570 h 40 M 60 570 v -40"/>
    <path d="M 1140 570 h -40 M 1140 570 v -40"/>
  </g>
</svg>