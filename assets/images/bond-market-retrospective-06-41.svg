<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#lineGradient)" stroke-width="3"/>

  <!-- Left accent bar -->
  <rect x="80" y="150" width="6" height="330" fill="url(#accentGradient)" rx="3" filter="url(#glow)"/>

  <!-- Title -->
  <text x="120" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" filter="url(#textGlow)">
    BOND MARKETS RETROSPECTIVE
  </text>

  <!-- Subtitle -->
  <text x="120" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    US, UK, and Europe — September 3, 2026
  </text>

  <!-- Divider line -->
  <line x1="120" y1="330" x2="400" y2="330" stroke="url(#accentGradient)" stroke-width="2" filter="url(#glow)"/>

  <!-- Key metrics boxes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- US 10Y -->
    <rect x="120" y="360" width="180" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="395" font-size="14" fill="#8b949e">US 10Y TREASURY</text>
    <text x="135" y="422" font-size="28" font-weight="700" fill="#f78166">4.81%</text>

    <!-- UK 30Y -->
    <rect x="320" y="360" width="180" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="335" y="395" font-size="14" fill="#8b949e">UK 30Y GILT</text>
    <text x="335" y="422" font-size="28" font-weight="700" fill="#f78166">5.87%</text>

    <!-- DE 10Y -->
    <rect x="520" y="360" width="180" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="535" y="395" font-size="14" fill="#8b949e">DE 10Y BUND</text>
    <text x="535" y="422" font-size="28" font-weight="700" fill="#58a6ff">3.37%</text>

    <!-- FR 10Y -->
    <rect x="720" y="360" width="180" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="735" y="395" font-size="14" fill="#8b949e">FR 10Y OAT</text>
    <text x="735" y="422" font-size="28" font-weight="700" fill="#a371f7">4.22%</text>

    <!-- BRENT -->
    <rect x="920" y="360" width="180" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="935" y="395" font-size="14" fill="#8b949e">BRENT CRUDE</text>
    <text x="935" y="422" font-size="28" font-weight="700" fill="#3fb950">$95/bbl</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">
    Yields surge as oil, inflation, and fiscal arithmetic converge
  </text>

  <!-- Bottom accent line -->
  <line x1="0" y1="630" x2="1200" y2="630" stroke="url(#lineGradient)" stroke-width="3"/>
</svg>