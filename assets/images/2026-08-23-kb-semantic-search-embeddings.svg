<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .label { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .dashed { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowhead); }
      .accent-blue { fill: #3b82f6; }
      .accent-cyan { fill: #06b6d4; }
      .accent-violet { fill: #8b5cf6; }
      .accent-amber { fill: #f59e0b; }
      .accent-rose { fill: #f43f5e; }
      .accent-emerald { fill: #10b981; }
      .accent-orange { fill: #f97316; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="520" />
  
  <!-- Header -->
  <text x="700" y="36" text-anchor="middle" class="title">Adding Semantic Search to My Knowledge Base</text>
  <text x="700" y="58" text-anchor="middle" class="subtitle">bge-small + sqlite-vec + Two Nasty Bugs + a Performance Rabbit Hole</text>

  <!-- Pipeline Flow -->
  <!-- Source KB -->
  <rect class="panel" x="60" y="100" width="220" height="320" />
  <text x="170" y="128" text-anchor="middle" class="label">Date-based KB</text>
  <text x="170" y="148" text-anchor="middle" class="sub">articles table</text>
  <text x="170" y="165" text-anchor="middle" class="sub">FTS5: articles_fts</text>
  
  <rect class="accent-cyan" x="90" y="195" width="160" height="60" rx="6" />
  <text x="170" y="218" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Chunker</text>
  <text x="170" y="235" text-anchor="middle" class="sub" style="fill: #0f172a;">~75 tokens / chunk</text>
  <text x="170" y="250" text-anchor="middle" class="code" style="fill: #0f172a;">overlap: 20%</text>

  <rect class="accent-violet" x="90" y="275" width="160" height="110" rx="6" />
  <text x="170" y="298" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">fastembed</text>
  <text x="170" y="315" text-anchor="middle" class="sub" style="fill: #0f172a;">BAAI/bge-small-en-v1.5</text>
  <text x="170" y="330" text-anchor="middle" class="sub" style="fill: #0f172a;">384-dim, 33M params</text>
  <text x="170" y="345" text-anchor="middle" class="sub" style="fill: #0f172a;">ONNX Runtime, CPU</text>
  <text x="170" y="360" text-anchor="middle" class="code" style="fill: #0f172a;">~550ms / chunk</text>

  <!-- Vector Store -->
  <rect class="panel" x="330" y="100" width="260" height="320" />
  <text x="460" y="128" text-anchor="middle" class="label">sqlite-vec (vec0)</text>
  <text x="460" y="148" text-anchor="middle" class="sub">article_chunks table</text>
  <text x="460" y="165" text-anchor="middle" class="sub">chunk_embeddings (vec0)</text>
  
  <rect class="accent-blue" x="370" y="195" width="180" height="110" rx="6" />
  <text x="460" y="218" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">HNSW Index</text>
  <text x="460" y="235" text-anchor="middle" class="sub" style="fill: #0f172a;">M=16, ef=100</text>
  <text x="460" y="250" text-anchor="middle" class="sub" style="fill: #0f172a;">cosine distance</text>
  <text x="460" y="265" text-anchor="middle" class="sub" style="fill: #0f172a;">~2M vectors ceiling</text>
  
  <rect class="accent-emerald" x="370" y="325" width="180" height="75" rx="6" />
  <text x="460" y="348" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Schema v3</text>
  <text x="460" y="365" text-anchor="middle" class="sub" style="fill: #0f172a;">triggers rebuilt</text>
  <text x="460" y="380" text-anchor="middle" class="sub" style="fill: #0f172a;">integrity: OK</text>

  <!-- Query Path -->
  <rect class="panel" x="650" y="100" width="260" height="320" />
  <text x="780" y="128" text-anchor="middle" class="label">Query Pipeline</text>
  
  <rect class="accent-amber" x="690" y="160" width="180" height="70" rx="6" />
  <text x="780" y="183" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Embed Query</text>
  <text x="780" y="200" text-anchor="middle" class="sub" style="fill: #0f172a;">same fastembed model</text>
  <text x="780" y="215" text-anchor="middle" class="sub" style="fill: #0f172a;">single vector, &amp;lt;50ms</text>

  <rect class="accent-rose" x="690" y="250" width="180" height="110" rx="6" />
  <text x="780" y="273" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Hybrid Search</text>
  <text x="780" y="290" text-anchor="middle" class="sub" style="fill: #0f172a;">vec0 KNN (k=20)</text>
  <text x="780" y="305" text-anchor="middle" class="sub" style="fill: #0f172a;">FTS5 BM25 (k=20)</text>
  <text x="780" y="320" text-anchor="middle" class="sub" style="fill: #0f172a;">RRF k=60 merge</text>
  <text x="780" y="335" text-anchor="middle" class="sub" style="fill: #0f172a;">top-10 results</text>

  <!-- Bugs Found -->
  <rect class="panel" x="970" y="100" width="370" height="320" />
  <text x="1155" y="128" text-anchor="middle" class="label">Bugs Found &amp; Fixed</text>
  
  <rect class="accent-orange" x="1000" y="155" width="310" height="70" rx="6" />
  <text x="1155" y="178" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Bug #1: FTS5 Trigger Corruption</text>
  <text x="1155" y="195" text-anchor="middle" class="sub" style="fill: #0f172a;">Latent rowid mismatch after schema migration</text>
  <text x="1155" y="210" text-anchor="middle" class="code" style="fill: #0f172a;">DROP + recreate triggers</text>

  <rect class="accent-rose" x="1000" y="240" width="310" height="70" rx="6" />
  <text x="1155" y="263" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Bug #2: Autocommit Fsync Trap</text>
  <text x="1155" y="280" text-anchor="middle" class="sub" style="fill: #0f172a;">Per-row commits = 2,963 fsyncs = 40 min</text>
  <text x="1155" y="295" text-anchor="middle" class="code" style="fill: #0f172a;">Explicit transactions = 1 fsync = 8 min</text>

  <rect class="accent-cyan" x="1000" y="325" width="310" height="75" rx="6" />
  <text x="1155" y="348" text-anchor="middle" class="title" style="font-size: 11px; fill: #0f172a;">Reality Check: CPU-Bound Backfill</text>
  <text x="1155" y="365" text-anchor="middle" class="sub" style="fill: #0f172a;">bge-small: 5 GFLOP/chunk x 2963 = genuine cost</text>
  <text x="1155" y="380" text-anchor="middle" class="sub" style="fill: #0f172a;">No quantized model in fastembed 0.8</text>

  <!-- Arrows -->
  <path class="arrow" d="M280 225 L330 225" />
  <path class="arrow" d="M590 225 L650 225" />
  <path class="dashed" d="M590 300 L650 300" />
  
  <!-- Bottom tagline -->
  <text x="700" y="460" text-anchor="middle" class="sub">Local-first No API keys No vector DB service Just SQLite files</text>
</svg>