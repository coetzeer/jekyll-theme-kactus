<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#3fb950" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
  
  <!-- Title -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    AI Tools Daily Update
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">
    November 10, 2026
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle">
    <text x="450" y="360" dominant-baseline="middle">Ripple-65B</text>
    <circle cx="530" cy="356" r="3" fill="#30363d"/>
    <text x="570" y="360" dominant-baseline="middle" fill="#a371f7">Tessera-27B</text>
    <circle cx="655" cy="356" r="3" fill="#30363d"/>
    <text x="700" y="360" dominant-baseline="middle" fill="#f78166">Spacefast</text>
    <circle cx="780" cy="356" r="3" fill="#30363d"/>
    <text x="810" y="360" dominant-baseline="middle" fill="#3fb950">Thrum</text>
    <circle cx="870" cy="356" r="3" fill="#30363d"/>
    <text x="920" y="360" dominant-baseline="middle" fill="#58a6ff">+6 more</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="300" y="420" width="600" height="2" fill="url(#accentGrad2)" opacity="0.5"/>
  
  <!-- Date/badge -->
  <text x="600" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6e7681" text-anchor="middle" dominant-baseline="middle">
    coetzeer.github.io/jekyll-theme-kactus
  </text>
  
  <!-- Small decorative elements -->
  <rect x="200" y="520" width="60" height="3" fill="#58a6ff" opacity="0.4" rx="1.5"/>
  <rect x="940" y="520" width="60" height="3" fill="#a371f7" opacity="0.4" rx="1.5"/>
</svg>