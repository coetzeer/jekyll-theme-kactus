<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d4a5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric light beam -->
  <ellipse cx="600" cy="100" rx="400" ry="80" fill="url(#lightGradient)"/>
  
  <!-- Decorative geometric elements - subtle circles suggesting raindrops/light -->
  <circle cx="150" cy="180" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="280" cy="140" r="1.5" fill="#58a6ff" opacity="0.2"/>
  <circle cx="420" cy="200" r="1" fill="#a371f7" opacity="0.25"/>
  <circle cx="850" cy="160" r="1.5" fill="#58a6ff" opacity="0.2"/>
  <circle cx="980" cy="220" r="2" fill="#a371f7" opacity="0.3"/>
  <circle cx="1100" cy="130" r="1" fill="#58a6ff" opacity="0.25"/>
  <circle cx="200" cy="480" r="1.5" fill="#58a6ff" opacity="0.2"/>
  <circle cx="1000" cy="500" r="1" fill="#a371f7" opacity="0.2"/>
  
  <!-- Horizontal line elements suggesting horizon/street -->
  <line x1="100" y1="420" x2="1100" y2="420" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="450" x2="1100" y2="450" stroke="#30363d" stroke-width="0.3" opacity="0.3"/>
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#30363d" stroke-width="0.2" opacity="0.2"/>
  
  <!-- Title text -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">The Weight of Light on Leopardstown</text>
  
  <!-- Subtitle/category -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3">A Dublin Morning · September 14, 2026</text>
  
  <!-- Decorative divider -->
  <line x1="500" y1="365" x2="700" y2="365" stroke="#58a6ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="600" cy="365" r="3" fill="#58a6ff" opacity="0.6"/>
  
  <!-- Author -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="middle" font-style="italic">James Joyce</text>
  
  <!-- Bottom accent line -->
  <line x1="300" y1="550" x2="900" y2="550" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>
</svg>