<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Rain lines -->
  <g stroke="#58a6ff" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="90" y2="630"/>
    <line x1="250" y1="0" x2="240" y2="630"/>
    <line x1="400" y1="0" x2="390" y2="630"/>
    <line x1="550" y1="0" x2="540" y2="630"/>
    <line x1="700" y1="0" x2="690" y2="630"/>
    <line x1="850" y1="0" x2="840" y2="630"/>
    <line x1="1000" y1="0" x2="990" y2="630"/>
    <line x1="1150" y1="0" x2="1140" y2="630"/>
  </g>
  
  <!-- Rain lines second layer -->
  <g stroke="#a371f7" stroke-width="0.5" opacity="0.3">
    <line x1="150" y1="0" x2="135" y2="630"/>
    <line x1="300" y1="0" x2="285" y2="630"/>
    <line x1="450" y1="0" x2="435" y2="630"/>
    <line x1="600" y1="0" x2="585" y2="630"/>
    <line x1="750" y1="0" x2="735" y2="630"/>
    <line x1="900" y1="0" x2="885" y2="630"/>
    <line x1="1050" y1="0" x2="1035" y2="630"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    Nine Degrees and the Weight of Rain
  </text>
  
  <!-- Subtitle line -->
  <line x1="400" y1="290" x2="800" y2="290" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Category/date -->
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle">
    James Joyce — Daily Observations — 21 October 2026
  </text>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="220" cy="510" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="185" cy="515" r="1.5" fill="#58a6ff" opacity="0.4"/>
  <circle cx="1000" cy="500" r="3" fill="#a371f7" opacity="0.6"/>
  <circle cx="980" cy="510" r="2" fill="#58a6ff" opacity="0.5"/>
  <circle cx="1015" cy="515" r="1.5" fill="#a371f7" opacity="0.4"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#accentGrad)" opacity="0.15"/>
</svg>