<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.02" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="180" rx="400" ry="200" fill="url(#lightGlow)"/>

  <!-- Rain lines -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.3">
    <line x1="50" y1="0" x2="30" y2="120"/>
    <line x1="120" y1="0" x2="100" y2="120"/>
    <line x1="190" y1="0" x2="170" y2="120"/>
    <line x1="260" y1="0" x2="240" y2="120"/>
    <line x1="330" y1="0" x2="310" y2="120"/>
    <line x1="400" y1="0" x2="380" y2="120"/>
    <line x1="470" y1="0" x2="450" y2="120"/>
    <line x1="540" y1="0" x2="520" y2="120"/>
    <line x1="610" y1="0" x2="590" y2="120"/>
    <line x1="680" y1="0" x2="660" y2="120"/>
    <line x1="750" y1="0" x2="730" y2="120"/>
    <line x1="820" y1="0" x2="800" y2="120"/>
    <line x1="890" y1="0" x2="870" y2="120"/>
    <line x1="960" y1="0" x2="940" y2="120"/>
    <line x1="1030" y1="0" x2="1010" y2="120"/>
    <line x1="1100" y1="0" x2="1080" y2="120"/>
    <line x1="1170" y1="0" x2="1150" y2="120"/>
  </g>

  <!-- More rain, lower density -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.2">
    <line x1="80" y1="100" x2="60" y2="220"/>
    <line x1="210" y1="100" x2="190" y2="220"/>
    <line x1="340" y1="100" x2="320" y2="220"/>
    <line x1="470" y1="100" x2="450" y2="220"/>
    <line x1="600" y1="100" x2="580" y2="220"/>
    <line x1="730" y1="100" x2="710" y2="220"/>
    <line x1="860" y1="100" x2="840" y2="220"/>
    <line x1="990" y1="100" x2="970" y2="220"/>
    <line x1="1120" y1="100" x2="1100" y2="220"/>
  </g>

  <!-- Stadium silhouette suggestion -->
  <g fill="#161b22" opacity="0.6">
    <!-- Aviva bowl suggestion -->
    <path d="M150 480 Q300 380 600 380 Q900 380 1050 480 L1050 520 L150 520 Z"/>
    <!-- Floodlight towers -->
    <rect x="180" y="320" width="8" height="60" fill="#30363d"/>
    <rect x="1012" y="320" width="8" height="60" fill="#30363d"/>
    <ellipse cx="184" cy="315" rx="12" ry="8" fill="#58a6ff" opacity="0.3"/>
    <ellipse cx="1016" cy="315" rx="12" ry="8" fill="#58a6ff" opacity="0.3"/>
  </g>

  <!-- Rain on ground - puddle reflections -->
  <g fill="#58a6ff" opacity="0.08">
    <ellipse cx="200" cy="520" rx="80" ry="15"/>
    <ellipse cx="450" cy="525" rx="60" ry="12"/>
    <ellipse cx="700" cy="518" rx="90" ry="18"/>
    <ellipse cx="950" cy="522" rx="70" ry="14"/>
  </g>

  <!-- Title text -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="-0.5px">The Rain Doesn't Care</text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.5px">Dublin morning · Fourteen thousand Americans · The Aviva waits</text>

  <!-- Decorative line -->
  <line x1="400" y2="365" x2="800" y1="365" stroke="#30363d" stroke-width="1"/>

  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="550" cy="365" r="3"/>
    <circle cx="600" cy="365" r="4"/>
    <circle cx="650" cy="365" r="3"/>
  </g>

  <!-- Bottom subtle texture -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="580" x2="1100" y2="580"/>
    <line x1="100" y1="600" x2="1100" y2="600"/>
  </g>
</svg>