<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric texture -->
  <g opacity="0.03">
    <circle cx="200" cy="150" r="300" fill="#58a6ff"/>
    <circle cx="900" cy="500" r="400" fill="#a371f7"/>
    <circle cx="600" cy="315" r="500" fill="#f78166"/>
  </g>

  <!-- Light pool suggesting breaking clouds -->
  <ellipse cx="600" cy="180" rx="400" ry="200" fill="url(#lightPool)"/>

  <!-- Rain streaks -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="150" y1="0" x2="140" y2="80"/>
    <line x1="300" y1="0" x2="285" y2="80"/>
    <line x1="450" y1="0" x2="435" y2="80"/>
    <line x1="600" y1="0" x2="585" y2="80"/>
    <line x1="750" y1="0" x2="735" y2="80"/>
    <line x1="900" y1="0" x2="885" y2="80"/>
    <line x1="1050" y1="0" x2="1035" y2="80"/>
    <line x1="200" y1="550" x2="185" y2="630"/>
    <line x1="500" y1="550" x2="485" y2="630"/>
    <line x1="800" y1="550" x2="785" y2="630"/>
    <line x1="1100" y1="550" x2="1085" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5px">Six Point Nine Degrees</text>

  <!-- Subtitle line -->
  <line x1="400" y1="310" x2="800" y2="310" stroke="url(#accentGradient)" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="600" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">and the Storm Coming In</text>

  <!-- Category/date -->
  <text x="600" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">James Joyce · Daily Observations · 22 October 2026</text>

  <!-- Decorative elements - subtle waves suggesting water/Liffey -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 100 520 Q 200 500 300 520 T 500 520 T 700 520 T 900 520 T 1100 520"/>
    <path d="M 100 550 Q 200 530 300 550 T 500 550 T 700 550 T 900 550 T 1100 550"/>
    <path d="M 100 580 Q 200 560 300 580 T 500 580 T 700 580 T 900 580 T 1100 580"/>
  </g>

  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.7">
    <circle cx="380" cy="310" r="3"/>
    <circle cx="820" cy="310" r="3"/>
  </g>
  <g fill="#a371f7" opacity="0.7">
    <circle cx="400" cy="310" r="2"/>
    <circle cx="800" cy="310" r="2"/>
  </g>
  <g fill="#f78166" opacity="0.7">
    <circle cx="420" cy="310" r="2"/>
    <circle cx="780" cy="310" r="2"/>
  </g>
</svg>