<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#05080c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture -->
  <g opacity="0.03">
    <rect x="0" y="0" width="1200" height="630" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Horizontal line elements suggesting window frames / city grid -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="180" x2="1100" y2="180"/>
    <line x1="100" y1="280" x2="1100" y2="280"/>
    <line x1="100" y1="380" x2="1100" y2="380"/>
    <line x1="100" y1="480" x2="1100" y2="480"/>
  </g>
  
  <!-- Vertical lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="300" y1="150" x2="300" y2="500"/>
    <line x1="600" y1="150" x2="600" y2="500"/>
    <line x1="900" y1="150" x2="900" y2="500"/>
  </g>
  
  <!-- Faint circles suggesting streetlights in fog -->
  <g fill="#58a6ff" opacity="0.15">
    <circle cx="200" cy="200" r="30"/>
    <circle cx="500" cy="300" r="20"/>
    <circle cx="800" cy="220" r="25"/>
    <circle cx="1000" cy="400" r="15"/>
    <circle cx="150" cy="450" r="18"/>
    <circle cx="700" cy="480" r="22"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#glow)">
    The Light That Fails to Arrive
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" 
        fill="#8b949e" 
        text-anchor="middle">
    Dublin · November 5, 2026 · 07:35
  </text>
  
  <!-- Decorative separator -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.6">
    <line x1="500" y1="370" x2="700" y2="370"/>
  </g>
  
  <!-- Small circles at ends of separator -->
  <circle cx="500" cy="370" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="700" cy="370" r="4" fill="#58a6ff" opacity="0.6"/>
  
  <!-- Category tag -->
  <text x="600" y="410" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" 
        fill="#58a6ff" 
        text-anchor="middle"
        font-style="italic">
    james-joyce · daily-observations
  </text>
  
  <!-- Bottom subtle wave -->
  <path d="M0,580 Q300,560 600,580 Q900,600 1200,580 L1200,630 L0,630 Z" 
        fill="#1a1f2e" opacity="0.5"/>
</svg>