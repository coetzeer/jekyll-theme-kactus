<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- subtle yield-curve lines -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <line x1="80" y1="150" x2="1120" y2="150"/>
    <line x1="80" y1="315" x2="1120" y2="315"/>
    <line x1="80" y1="480" x2="1120" y2="480"/>
  </g>
  <!-- three ascending yield curves: US, UK, EU -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="5">
    <polyline points="80,480 300,430 520,380 740,330 960,280 1120,245" stroke="#58a6ff"/>
    <polyline points="80,460 300,395 520,335 740,275 960,215 1120,170" stroke="#f78166"/>
    <polyline points="80,490 300,450 520,410 740,375 960,345 1120,325" stroke="#a371f7"/>
  </g>
  <circle cx="1120" cy="245" r="6" fill="#58a6ff"/>
  <circle cx="1120" cy="170" r="6" fill="#f78166"/>
  <circle cx="1120" cy="325" r="6" fill="#a371f7"/>
  <!-- labels -->
  <text x="80" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#ffffff">Global Bond Yields on the Edge</text>
  <text x="82" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b949e">Iran shock &amp; inflation fears — September 5, 2026</text>
  <text x="940" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#58a6ff">US</text>
  <text x="940" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f78166">UK</text>
  <text x="940" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#a371f7">EU</text>
</svg>
