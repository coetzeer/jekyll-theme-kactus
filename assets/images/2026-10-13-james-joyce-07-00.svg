<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle atmospheric gradient overlay -->
  <rect width="1200" height="630" fill="url(#accentGrad)"/>
  
  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="url(#glowGrad)"/>
  
  <!-- Decorative horizontal lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.6">
    <line x1="100" y1="180" x2="1100" y2="180"/>
    <line x1="100" y1="450" x2="1100" y2="450"/>
  </g>
  
  <!-- Vertical accent lines -->
  <g stroke="#58a6ff" stroke-width="1.5" opacity="0.4">
    <line x1="200" y1="180" x2="200" y2="450"/>
    <line x1="1000" y1="180" x2="1000" y2="450"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.5px">
    The Light Falls Differently
  </text>
  
  <text x="600" y="335" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="32" 
        font-weight="500" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.3px">
    on Parnell Square
  </text>
  
  <!-- Subtitle/category -->
  <text x="600" y="410" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" 
        fill="#8b949e" 
        text-anchor="middle"
        letter-spacing="1px">
    JAMES JOYCE  •  DAILY OBSERVATIONS  •  13 OCTOBER 2026
  </text>
  
  <!-- Decorative circles -->
  <g fill="none" stroke="#30363d" stroke-width="1" opacity="0.3">
    <circle cx="150" cy="150" r="60"/>
    <circle cx="1050" cy="150" r="60"/>
    <circle cx="150" cy="480" r="60"/>
    <circle cx="1050" cy="480" r="60"/>
  </g>
  
  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="600" cy="180" r="3"/>
    <circle cx="600" cy="450" r="3"/>
    <circle cx="200" cy="315" r="2"/>
    <circle cx="1000" cy="315" r="2"/>
  </g>
  
  <!-- Faint wave pattern at bottom -->
  <path d="M0,580 Q300,550 600,580 T1200,580 L1200,630 L0,630 Z" 
        fill="#0d1117" opacity="0.5"/>
</svg>