<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <rect x="50" y="500" width="200" height="1" fill="url(#lineGrad)"/>
  <rect x="950" y="80" width="200" height="1" fill="url(#lineGrad)"/>
  
  <!-- Central decorative line -->
  <line x1="600" y1="200" x2="600" y2="430" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="315" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="315" r="8" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="315" r="15" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2"/>
  
  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    Seven Degrees and the Weight of Memory
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    A November morning in Dublin
  </text>
  
  <!-- Category/date line -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#58a6ff" text-anchor="middle" opacity="0.8">
    James Joyce · Daily Observations · 14 November 2026
  </text>
  
  <!-- Bottom accent -->
  <line x1="400" y1="500" x2="800" y2="500" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="502" x2="800" y2="502" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  
  <!-- Small decorative dots -->
  <circle cx="550" cy="500" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="650" cy="500" r="2" fill="#a371f7" opacity="0.6"/>
</svg>