<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c9d1d9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.1"/>
  <rect x="50" y="500" width="200" height="1" fill="url(#accentGrad)" opacity="0.3"/>
  <rect x="950" y="100" width="1" height="150" fill="url(#accentGrad)" opacity="0.3"/>
  
  <!-- Wave decoration -->
  <path d="M 0 580 Q 300 520 600 580 T 1200 580" fill="none" stroke="#30363d" stroke-width="2" opacity="0.5"/>
  
  <!-- Title area -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">AI Tools Daily Update</text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#8b949e">October 8, 2026</text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="480" y="360" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="530" y="382" fill="#58a6ff">Open Source</text>
    
    <rect x="610" y="360" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="660" y="382" fill="#a371f7">Long-Running</text>
    
    <rect x="740" y="360" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="790" y="382" fill="#3fb950">Agents</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="450" x2="800" y2="450" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small dots -->
  <circle cx="550" cy="450" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="650" cy="450" r="4" fill="#a371f7" opacity="0.6"/>
  <circle cx="750" cy="450" r="4" fill="#3fb950" opacity="0.6"/>
</svg>