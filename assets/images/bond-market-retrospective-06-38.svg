<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGradient)" stroke-width="4"/>

  <!-- Left accent bar -->
  <rect x="80" y="120" width="8" height="390" rx="4" fill="url(#accentGradient)" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="120" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#e6edf3" filter="url(#textGlow)">Bond Markets</text>
  <text x="120" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#e6edf3" filter="url(#textGlow)">Retrospective</text>

  <!-- Subtitle -->
  <text x="120" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8b949e">US, UK & Europe  ·  September 2, 2026</text>

  <!-- Divider line -->
  <line x1="120" y1="350" x2="400" y2="350" stroke="url(#lineGradient)" stroke-width="2"/>

  <!-- Key metrics boxes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- US -->
    <rect x="120" y="380" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="140" y="415" font-size="14" font-weight="600" fill="#8b949e">US 10Y</text>
    <text x="140" y="455" font-size="28" font-weight="700" fill="#f78166">4.80%</text>

    <!-- UK -->
    <rect x="320" y="380" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="340" y="415" font-size="14" font-weight="600" fill="#8b949e">UK 10Y</text>
    <text x="340" y="455" font-size="28" font-weight="700" fill="#f78166">5.25%</text>

    <!-- Germany -->
    <rect x="520" y="380" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="415" font-size="14" font-weight="600" fill="#8b949e">DE 10Y</text>
    <text x="540" y="455" font-size="28" font-weight="700" fill="#58a6ff">3.32%</text>

    <!-- France -->
    <rect x="720" y="380" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="740" y="415" font-size="14" font-weight="600" fill="#8b949e">FR 10Y</text>
    <text x="740" y="455" font-size="28" font-weight="700" fill="#58a6ff">4.22%</text>

    <!-- Oil -->
    <rect x="920" y="380" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="940" y="415" font-size="14" font-weight="600" fill="#8b949e">BRENT</text>
    <text x="940" y="455" font-size="28" font-weight="700" fill="#ffcc00">$90.49</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8b949e" text-anchor="middle">Global bond rout deepens on oil shock, fiscal pressure & hawkish central banks</text>

  <!-- Bottom accent line -->
  <line x1="0" y1="630" x2="1200" y2="630" stroke="url(#accentGradient)" stroke-width="4"/>
</svg>