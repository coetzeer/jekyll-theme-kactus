<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle geometric elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="100" r="60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.15"/>

  <!-- Decorative line elements -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="202" x2="180" y2="202" stroke="#58a6ff" stroke-width="1" opacity="0.4"/>
  <line x1="900" y1="430" x2="1100" y2="430" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>

  <!-- Small accent circles -->
  <circle cx="100" cy="200" r="3" fill="#58a6ff" opacity="0.8"/>
  <circle cx="300" cy="200" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="900" cy="430" r="2.5" fill="#f78166" opacity="0.7"/>
  <circle cx="1100" cy="430" r="2" fill="#3fb950" opacity="0.5"/>

  <!-- Title text -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)">
    The Light Fails Differently in November
  </text>

  <!-- Subtitle/category -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">
    James Joyce · Daily Observations · 28 November 2026
  </text>

  <!-- Divider line -->
  <line x1="400" y1="360" x2="800" y2="360" stroke="#30363d" stroke-width="1"/>

  <!-- Weather/atmosphere indicator -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">
    8.2°C · Overcast · Dublin · The Spire catches nothing
  </text>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accentGradient)" opacity="0.15"/>
</svg>