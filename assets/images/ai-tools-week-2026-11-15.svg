<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative grid lines -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>
  
  <!-- Accent line -->
  <line x1="100" y1="180" x2="1100" y2="180" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)">
    AI Tools This Week
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    November 9–15, 2026  •  20+ Launches
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff">
    <text x="600" y="380" text-anchor="middle" opacity="0.8">Coding Agents  •  Foundation Models  •  Agent Platforms</text>
    <text x="600" y="410" text-anchor="middle" opacity="0.8">Personal Agents  •  Testing  •  Voice</text>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="60" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="1000" cy="150" r="60" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="480" r="40" fill="none" stroke="#f78166" stroke-width="1" opacity="0.2"/>
  <circle cx="1000" cy="480" r="40" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.2"/>
  
  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="300" cy="200" r="3"/>
    <circle cx="900" cy="200" r="3"/>
    <circle cx="300" cy="430" r="3"/>
    <circle cx="900" cy="430" r="3"/>
  </g>
  
  <!-- Bottom accent -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58">
    coetzeer.github.io/jekyll-theme-kactus
  </text>
</svg>