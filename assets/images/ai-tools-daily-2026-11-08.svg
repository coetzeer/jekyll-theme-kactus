<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  
  <!-- Decorative geometric elements -->
  <circle cx="150" cy="120" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="120" r="40" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="510" r="100" fill="none" stroke="#f78166" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="510" r="50" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.2"/>
  
  <!-- Accent lines -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="900" y1="430" x2="1100" y2="430" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>
  
  <!-- Small decorative squares -->
  <rect x="200" y="80" width="4" height="4" fill="#58a6ff" opacity="0.5"/>
  <rect x="210" y="90" width="3" height="3" fill="#a371f7" opacity="0.4"/>
  <rect x="195" y="100" width="2" height="2" fill="#f78166" opacity="0.3"/>
  
  <rect x="1000" y="470" width="3" height="3" fill="#f78166" opacity="0.4"/>
  <rect x="1010" y="480" width="2" height="2" fill="#3fb950" opacity="0.3"/>
  <rect x="1005" y="490" width="2" height="2" fill="#58a6ff" opacity="0.3"/>
  
  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">AI Tools Daily Update</text>
  
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">November 8, 2026</text>
  
  <!-- Category tag -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#58a6ff" text-transform="uppercase" letter-spacing="2px">Coding Agents · Long-Running Agents · Infrastructure</text>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="url(#accentGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Version/date info -->
  <text x="600" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6e7681">15 tools • 6 coding agents • 5 long-running agents • 4 infrastructure drops</text>
  
  <!-- Subtle wave decoration at bottom -->
  <path d="M0,630 Q300,580 600,630 T1200,630" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
</svg>