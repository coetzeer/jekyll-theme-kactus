<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle geometric decoration -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <rect x="50" y="500" width="200" height="1" fill="url(#accentGrad)"/>
  <rect x="950" y="80" width="180" height="1" fill="url(#accentGrad)"/>

  <!-- Decorative wave line - evoking November light on water -->
  <path d="M 0 315 Q 300 280 600 315 T 1200 315" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" dominant-baseline="middle">Seven Degrees and the Weight of Numbers</text>

  <!-- Subtitle -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">Daily observations & epiphanies</text>

  <!-- Date line -->
  <text x="600" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle" dominant-baseline="middle">12 November 2026</text>

  <!-- Small decorative elements - three dots like breath in cold air -->
  <circle cx="580" cy="405" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="620" cy="405" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="420" r="2" fill="#58a6ff" opacity="0.4"/>

  <!-- Rose petals suggestion - scattered light -->
  <g fill="url(#roseGrad)" opacity="0.4">
    <ellipse cx="200" cy="200" rx="8" ry="4" transform="rotate(-30 200 200)"/>
    <ellipse cx="1000" cy="180" rx="6" ry="3" transform="rotate(45 1000 180)"/>
    <ellipse cx="180" cy="450" rx="7" ry="3" transform="rotate(15 180 450)"/>
    <ellipse cx="1020" cy="430" rx="5" ry="2" transform="rotate(-20 1020 430)"/>
  </g>

  <!-- Subtle cable lines suggestion - Samuel Beckett Bridge -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.25">
    <line x1="200" y1="100" x2="200" y2="250"/>
    <line x1="300" y1="80" x2="300" y2="250"/>
    <line x1="400" y1="70" x2="400" y2="250"/>
    <line x1="500" y1="65" x2="500" y2="250"/>
    <line x1="700" y1="65" x2="700" y2="250"/>
    <line x1="800" y1="70" x2="800" y2="250"/>
    <line x1="900" y1="80" x2="900" y2="250"/>
    <line x1="1000" y1="100" x2="1000" y2="250"/>
  </g>

  <!-- Temperature notation -->
  <text x="1100" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#30363d" text-anchor="end" dominant-baseline="middle">7.2°C</text>
</svg>