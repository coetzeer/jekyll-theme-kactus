<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0d12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric circles -->
  <circle cx="150" cy="150" r="200" fill="url(#lightPool)" opacity="0.4"/>
  <circle cx="1050" cy="500" r="180" fill="#a371f7" opacity="0.08"/>
  <circle cx="300" cy="550" r="150" fill="#58a6ff" opacity="0.06"/>

  <!-- Thin horizontal lines suggesting rain/horizon -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="202" x2="1100" y2="202"/>
    <line x1="100" y1="430" x2="1100" y2="430"/>
    <line x1="100" y1="432" x2="1100" y2="432"/>
  </g>

  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">
    Eight Point Eight Degrees
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" font-weight="400">
    and the Weight of November
  </text>

  <!-- Date line -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" font-weight="500">
    7 November 2026  •  Dublin  •  Overcast
  </text>

  <!-- Decorative divider -->
  <g stroke="url(#accentGradient)" stroke-width="2" opacity="0.6">
    <line x1="500" y1="420" x2="700" y2="420"/>
  </g>

  <!-- Small circles on divider -->
  <circle cx="500" cy="420" r="4" fill="#58a6ff" opacity="0.8"/>
  <circle cx="600" cy="420" r="3" fill="#a371f7" opacity="0.8"/>
  <circle cx="700" cy="420" r="4" fill="#58a6ff" opacity="0.8"/>

  <!-- Category tag -->
  <text x="600" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58" font-weight="500" text-transform="uppercase" letter-spacing="2px">
    James Joyce  •  Daily Observations
  </text>

  <!-- Bottom accent line -->
  <line x1="200" y1="580" x2="1000" y2="580" stroke="#30363d" stroke-width="1" opacity="0.5"/>
</svg>