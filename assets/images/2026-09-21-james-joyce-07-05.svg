<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Sky gradient overlay -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Abstract river/Liffey shape -->
  <path d="M -50 480 Q 300 520 600 490 Q 900 460 1250 500 L 1250 630 L -50 630 Z" fill="#161b22" opacity="0.6"/>

  <!-- River highlight -->
  <path d="M -50 480 Q 300 520 600 490 Q 900 460 1250 500" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>

  <!-- CCTV camera silhouettes (subtle) -->
  <g fill="#30363d" opacity="0.25">
    <!-- Camera 1 -->
    <rect x="150" y="180" width="30" height="20" rx="2"/>
    <circle cx="165" cy="190" r="10"/>
    <rect x="160" y="200" width="10" height="40" rx="1"/>
    <!-- Camera 2 -->
    <rect x="400" y="140" width="25" height="18" rx="2"/>
    <circle cx="412" cy="149" r="8"/>
    <rect x="408" y="158" width="8" height="35" rx="1"/>
    <!-- Camera 3 -->
    <rect x="750" y="200" width="28" height="18" rx="2"/>
    <circle cx="764" cy="209" r="9"/>
    <rect x="760" y="218" width="9" height="38" rx="1"/>
    <!-- Camera 4 -->
    <rect x="1000" y="160" width="32" height="22" rx="2"/>
    <circle cx="1016" cy="171" r="11"/>
    <rect x="1012" y="182" width="11" height="42" rx="1"/>
  </g>

  <!-- Runner silhouettes in Phoenix Park area -->
  <g fill="#30363d" opacity="0.15">
    <g transform="translate(200, 350)">
      <circle cx="0" cy="0" r="4"/>
      <line x1="0" y1="4" x2="0" y2="18" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="-6" y2="18" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="6" y2="18" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="-5" y2="30" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="5" y2="30" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(230, 355)">
      <circle cx="0" cy="0" r="3.5"/>
      <line x1="0" y1="3.5" x2="0" y2="16" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="0" y1="9" x2="-5" y2="16" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="9" x2="5" y2="16" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="-4" y2="26" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="4" y2="26" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <g transform="translate(260, 352)">
      <circle cx="0" cy="0" r="3.5"/>
      <line x1="0" y1="3.5" x2="0" y2="15" stroke="#30363d" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="-4" y2="15" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="4" y2="15" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="-3" y2="24" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="3" y2="24" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5px">The City Watches Itself</text>

  <!-- Subtitle/category -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Dublin · September 21, 2026 · Daily Observations</text>

  <!-- Decorative line -->
  <line x1="450" y1="255" x2="750" y2="255" stroke="url(#accentGradient)" stroke-width="2"/>

  <!-- Small decorative circles -->
  <circle cx="500" cy="255" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="255" r="4" fill="#a371f7" opacity="0.7"/>
  <circle cx="700" cy="255" r="3" fill="#58a6ff" opacity="0.6"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)" opacity="0.15"/>

  <!-- Faint birds/gulls -->
  <g fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.15">
    <path d="M 100 100 Q 110 90 120 100 Q 130 90 140 100"/>
    <path d="M 1100 80 Q 1115 70 1130 80 Q 1145 70 1160 80"/>
    <path d="M 800 120 Q 810 110 820 120 Q 830 110 840 120"/>
    <path d="M 400 90 Q 410 80 420 90 Q 430 80 440 90"/>
  </g>
</svg>