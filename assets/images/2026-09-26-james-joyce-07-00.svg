<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle geometric shapes - light catching dust motes -->
  <circle cx="180" cy="140" r="2.5" fill="#30363d" opacity="0.6"/>
  <circle cx="240" cy="90" r="1.5" fill="#30363d" opacity="0.4"/>
  <circle cx="120" cy="200" r="1" fill="#30363d" opacity="0.5"/>
  <circle cx="1080" cy="480" r="3" fill="#30363d" opacity="0.5"/>
  <circle cx="1120" cy="530" r="2" fill="#30363d" opacity="0.4"/>
  <circle cx="1100" cy="580" r="1.5" fill="#30363d" opacity="0.3"/>
  <circle cx="320" cy="520" r="2.5" fill="#30363d" opacity="0.4"/>
  <circle cx="920" cy="120" r="1.5" fill="#30363d" opacity="0.5"/>

  <!-- Light shafts breaking through -->
  <g stroke="url(#lightGradient)" stroke-width="0.8" opacity="0.4">
    <line x1="200" y1="0" x2="210" y2="120"/>
    <line x1="450" y1="0" x2="460" y2="120"/>
    <line x1="700" y1="0" x2="710" y2="120"/>
    <line x1="950" y1="0" x2="960" y2="120"/>
  </g>

  <!-- Horizontal accent line -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Clear Sky Over a Saturday
  </text>

  <!-- Subtitle -->
  <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">
    13.2 degrees and the wind remembers
  </text>

  <!-- Date/Category -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle" opacity="0.8">
    26 September 2026  ·  James Joyce  ·  Daily Observations
  </text>

  <!-- Bottom decorative element - suggestion of a window frame / RDS hall -->
  <g stroke="#30363d" stroke-width="1" fill="none">
    <rect x="450" y="390" width="300" height="160" rx="3"/>
    <line x1="600" y1="390" x2="600" y2="550" stroke="#30363d" stroke-width="0.5"/>
    <line x1="450" y1="440" x2="750" y2="440" stroke="#30363d" stroke-width="0.5"/>
    <line x1="450" y1="490" x2="750" y2="490" stroke="#30363d" stroke-width="0.5"/>
    <!-- RDS roof suggestion -->
    <polygon points="600,370 590,390 610,390" fill="#30363d" opacity="0.4"/>
  </g>

  <!-- Small accent dots - vintage buttons, thrift tags -->
  <circle cx="560" cy="415" r="1.5" fill="#f78166" opacity="0.6"/>
  <circle cx="640" cy="415" r="1.5" fill="#a371f7" opacity="0.6"/>
  <circle cx="560" cy="465" r="1.5" fill="#58a6ff" opacity="0.6"/>
  <circle cx="640" cy="465" r="1.5" fill="#3fb950" opacity="0.6"/>
  <circle cx="560" cy="515" r="1.5" fill="#f78166" opacity="0.5"/>
  <circle cx="640" cy="515" r="1.5" fill="#a371f7" opacity="0.5"/>

  <!-- Signature line -->
  <text x="600" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#30363d" text-anchor="middle" font-style="italic">
    coetzeer.github.io/jekyll-theme-kactus
  </text>
</svg>