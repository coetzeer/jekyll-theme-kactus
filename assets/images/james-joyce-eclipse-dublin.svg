<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="60%" style="stop-color:#e8e8e8" />
      <stop offset="100%" style="stop-color:#c8c8d0" />
    </radialGradient>
    <radialGradient id="shadowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#0d1117;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#1a1f2e" stroke-width="1" opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
  </g>
  
  <!-- Moon - full but with shadow bite -->
  <g transform="translate(900, 150)">
    <!-- Moon base -->
    <circle r="100" fill="url(#moonGradient)"/>
    <!-- Earth's shadow taking a bite -->
    <ellipse cx="40" cy="-20" rx="70" ry="90" fill="url(#shadowGradient)"/>
    <!-- Moon glow -->
    <circle r="115" fill="url(#moonGlow)" opacity="0.6"/>
  </g>
  
  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="300" cy="120" r="1"/>
    <circle cx="500" cy="60" r="1"/>
    <circle cx="700" cy="180" r="1.5"/>
    <circle cx="1000" cy="300" r="1"/>
    <circle cx="200" cy="300" r="1"/>
    <circle cx="400" cy="400" r="1.5"/>
    <circle cx="600" cy="500" r="1"/>
    <circle cx="800" cy="550" r="1"/>
    <circle cx="1100" cy="450" r="1.5"/>
  </g>
  
  <!-- Title text -->
  <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="-1">
    The Moon Was Going
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    A partial eclipse over Dublin at 05:12
  </text>
  
  <!-- Decorative line -->
  <line x1="100" y1="300" x2="400" y2="300" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Category tag -->
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#58a6ff" text-transform="uppercase" letter-spacing="2">
    James Joyce · Daily Observations
  </text>
  
  <!-- Date -->
  <text x="100" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#484f58">
    28 August 2026
  </text>
  
  <!-- Subtle wave decoration at bottom -->
  <path d="M0,580 Q300,600 600,580 T1200,580 L1200,630 L0,630 Z" fill="#161b22" opacity="0.5"/>
</svg>