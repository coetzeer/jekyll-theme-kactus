<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>
  
  <!-- Decorative accent line -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Title -->
  <text x="100" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#titleGrad)">
    This Week in AI Tools
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    Persistent Coordinators, Multi-Model Routing, and CI That Finally Works
  </text>
  
  <!-- Category badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="100" y="380" width="160" height="36" rx="6" fill="#58a6ff" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="180" y="404" text-anchor="middle" fill="#58a6ff">Long-running Agents</text>
    
    <rect x="280" y="380" width="160" height="36" rx="6" fill="#a371f7" fill-opacity="0.2" stroke="#a371f7" stroke-width="1"/>
    <text x="360" y="404" text-anchor="middle" fill="#a371f7">Coding Agents</text>
    
    <rect x="460" y="380" width="140" height="36" rx="6" fill="#3fb950" fill-opacity="0.2" stroke="#3fb950" stroke-width="1"/>
    <text x="530" y="404" text-anchor="middle" fill="#3fb950">Open Source</text>
    
    <rect x="620" y="380" width="120" height="36" rx="6" fill="#f78166" fill-opacity="0.2" stroke="#f78166" stroke-width="1"/>
    <text x="680" y="404" text-anchor="middle" fill="#f78166">CI/CD</text>
  </g>
  
  <!-- Date -->
  <text x="100" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">
    September 14, 2026
  </text>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="530" r="80" fill="url(#accentGrad)" fill-opacity="0.05" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="1100" cy="530" r="50" fill="url(#accentGrad)" fill-opacity="0.08" stroke="url(#accentGrad)" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="1100" cy="530" r="25" fill="url(#accentGrad)" fill-opacity="0.15"/>
  
  <circle cx="100" cy="530" r="60" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="530" r="30" fill="#58a6ff" fill-opacity="0.15"/>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="580" x2="1100" y2="580" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Source attribution -->
  <text x="600" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58" text-anchor="middle">
    Cursor · GitHub Copilot · Anthropic · Open Source
  </text>
</svg>