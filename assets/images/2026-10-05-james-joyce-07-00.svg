<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric elements -->
  <circle cx="150" cy="120" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="150" cy="120" r="40" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1050" cy="510" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="510" r="60" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Horizontal accent line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="430" x2="1100" y2="430" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="bold" fill="#ffffff" 
        style="filter: url(#glow);">
    The Weight of Grey Light
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="345" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" fill="#8b949e">
    Monday, 5 October 2026 — Dublin
  </text>
  
  <!-- Category tags -->
  <text x="600" y="390" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#58a6ff" opacity="0.8">
    james-joyce  •  daily-observations
  </text>
  
  <!-- Decorative waves at bottom -->
  <path d="M0,580 Q300,550 600,580 T1200,580 L1200,630 L0,630 Z" 
        fill="#161b22" opacity="0.5"/>
  <path d="M0,590 Q300,560 600,590 T1200,590 L1200,630 L0,630 Z" 
        fill="#0d1117" opacity="0.7"/>
  
  <!-- Small accent dots -->
  <circle cx="300" cy="180" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="900" cy="450" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="600" cy="100" r="1.5" fill="#f78166" opacity="0.5"/>
  <circle cx="400" cy="530" r="1.5" fill="#3fb950" opacity="0.5"/>
  <circle cx="800" cy="80" r="1.5" fill="#58a6ff" opacity="0.4"/>
</svg>