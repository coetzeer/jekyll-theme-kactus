<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0d12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture -->
  <g opacity="0.03">
    <circle cx="150" cy="120" r="200" fill="#58a6ff"/>
    <circle cx="1050" cy="500" r="180" fill="#a371f7"/>
    <circle cx="600" cy="315" r="300" fill="#f78166"/>
  </g>
  
  <!-- Horizontal accent lines -->
  <g stroke="url(#accentGradient)" stroke-width="1" fill="none" opacity="0.4">
    <line x1="100" y1="200" x2="1100" y2="200" stroke-dasharray="20,10"/>
    <line x1="100" y1="430" x2="1100" y2="430" stroke-dasharray="20,10"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Light Over Cork Street
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    September 10, 2026 — 14.2°C, Overcast
  </text>
  
  <!-- Category tag -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#58a6ff" text-anchor="middle" letter-spacing="1px" text-transform="uppercase">
    James Joyce · Daily Observations
  </text>
  
  <!-- Decorative elements - subtle geometric marks -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.5">
    <rect x="450" y="220" width="300" height="1" />
    <rect x="450" y="410" width="300" height="1" />
    <circle cx="600" cy="315" r="3" fill="#58a6ff" opacity="0.6"/>
  </g>
  
  <!-- Bottom accent -->
  <rect x="100" y="520" width="1000" height="1" fill="url(#accentGradient)" opacity="0.3"/>
  
  <!-- Small corner marks -->
  <g stroke="#30363d" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1120 80 h -40 M 1120 80 v 40"/>
    <path d="M 80 550 h 40 M 80 550 v -40"/>
    <path d="M 1120 550 h -40 M 1120 550 v -40"/>
  </g>
</svg>