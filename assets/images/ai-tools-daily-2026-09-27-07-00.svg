<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="url(#accentGrad2)" stroke-width="2" opacity="0.3"/>
  <circle cx="1150" cy="100" r="40" fill="url(#accentGrad)" opacity="0.2"/>
  <circle cx="50" cy="530" r="60" fill="url(#accentGrad2)" opacity="0.15"/>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    AI Tools Daily
  </text>
  
  <!-- Date -->
  <text x="600" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e">
    September 27, 2026
  </text>
  
  <!-- Divider line -->
  <line x1="400" y1="375" x2="800" y2="375" stroke="url(#accentGrad)" stroke-width="3"/>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">
    <rect x="480" y="400" width="110" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="535" y="425" text-anchor="middle" fill="#58a6ff">9 Updates</text>
    
    <rect x="610" y="400" width="140" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="680" y="425" text-anchor="middle" fill="#a371f7">4 Open Source</text>
    
    <rect x="770" y="400" width="120" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
    <text x="830" y="425" text-anchor="middle" fill="#f78166">5 Commercial</text>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#accentGrad)" opacity="0.6"/>
</svg>