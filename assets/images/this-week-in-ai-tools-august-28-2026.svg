<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1050" cy="480" r="120" fill="url(#accentGrad2)" opacity="0.08"/>
  <circle cx="900" cy="100" r="40" fill="#58a6ff" opacity="0.15"/>
  <circle cx="300" cy="550" r="60" fill="#a371f7" opacity="0.1"/>
  
  <!-- Title -->
  <text x="600" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">This Week in AI Tools</text>
  
  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">August 28, 2026</text>
  
  <!-- Accent line -->
  <line x1="450" y1="330" x2="750" y2="330" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">
    <rect x="500" y="360" width="100" height="30" rx="15" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="550" y="382" text-anchor="middle" fill="#58a6ff">Open Source</text>
    
    <rect x="620" y="360" width="100" height="30" rx="15" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="1"/>
    <text x="670" y="382" text-anchor="middle" fill="#a371f7">Coding Agents</text>
    
    <rect x="740" y="360" width="120" height="30" rx="15" fill="#f78166" opacity="0.2" stroke="#f78166" stroke-width="1"/>
    <text x="800" y="382" text-anchor="middle" fill="#f78166">Long-Running</text>
  </g>
  
  <!-- Bottom accent -->
  <line x1="100" y1="580" x2="1100" y2="580" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="605" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58">coetzeer.github.io/jekyll-theme-kactus</text>
</svg>