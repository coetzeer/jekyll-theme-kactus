<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="url(#accentGradient2)" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="550" r="60" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1000" cy="80" r="90" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">AI Tools Daily Update</text>
  
  <!-- Date -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">November 28, 2026</text>
  
  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff">23 new tools • Orchestration layer • MCP everywhere</text>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">
    <text x="600" y="460" text-anchor="middle">Coding Agents  •  MCP Servers  •  Open Models  •  Infrastructure</text>
  </g>
  
  <!-- Small decorative dots -->
  <g fill="#58a6ff" opacity="0.6">
    <circle cx="550" cy="455" r="3"/>
    <circle cx="650" cy="455" r="3"/>
  </g>
  <g fill="#a371f7" opacity="0.6">
    <circle cx="550" cy="465" r="3"/>
    <circle cx="650" cy="465" r="3"/>
  </g>
</svg>