<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="none" stroke="#30363d" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2"/>
  <rect x="80" y="500" width="60" height="4" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
  <rect x="1060" y="80" width="4" height="60" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Tools Daily</text>
  
  <!-- Date -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e" text-anchor="middle">September 30, 2026</text>
  
  <!-- Subtitle -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">7 new tools: Base44, OpenAI Codex Cloud & Dots, MongoDB Atlas Agent Engine, MATE, NucleusIQ, Multiply</text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="450" y="450" width="130" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <text x="515" y="473" fill="#58a6ff">Coding Agents</text>
    
    <rect x="590" y="450" width="150" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <text x="665" y="473" fill="#a371f7">Long-Running</text>
    
    <rect x="750" y="450" width="110" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <text x="805" y="473" fill="#f78166">Other</text>
  </g>
</svg>