<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative geometric elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="150" cy="150" r="60" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="1050" cy="480" r="70" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Accent lines -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="430" x2="250" y2="430" stroke="url(#accentGrad2)" stroke-width="1" stroke-linecap="round"/>
  <line x1="900" y1="200" x2="1100" y2="200" stroke="url(#accentGrad2)" stroke-width="1" stroke-linecap="round"/>
  <line x1="900" y1="430" x2="1100" y2="430" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small decorative dots -->
  <g fill="#58a6ff" opacity="0.6">
    <circle cx="200" cy="100" r="2"/>
    <circle cx="220" cy="110" r="1.5"/>
    <circle cx="190" cy="125" r="1"/>
    <circle cx="1000" cy="530" r="2"/>
    <circle cx="1020" cy="520" r="1.5"/>
    <circle cx="990" cy="540" r="1"/>
  </g>
  
  <g fill="#a371f7" opacity="0.6">
    <circle cx="300" cy="50" r="1.5"/>
    <circle cx="900" cy="580" r="1.5"/>
  </g>
  
  <g fill="#f78166" opacity="0.6">
    <circle cx="1100" cy="100" r="1.5"/>
    <circle cx="100" cy="580" r="1.5"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    This Week in AI Tools
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">
    August 27, 2026
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="450" y="400" fill="#58a6ff">🌐 Cloudflare Kitesurf</text>
    <text x="750" y="400" fill="#a371f7">💬 Slack Code</text>
    <text x="600" y="430" fill="#f78166">🔍 WarpGrep v2</text>
    <text x="450" y="460" fill="#3fb950">📝 PaperOrchestra</text>
    <text x="750" y="460" fill="#58a6ff">⚙️ MCP 2026 Spec</text>
  </g>
  
  <!-- Bottom accent -->
  <line x1="400" y1="500" x2="800" y2="500" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Footer -->
  <text x="600" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#6e7681" text-anchor="middle" dominant-baseline="middle">
    ai-tools-weekly · coetzeer.github.io/jekyll-theme-kactus
  </text>
</svg>