<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative geometric elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="150" r="40" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#f78166" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="50" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.3"/>
  <rect x="100" y="450" width="60" height="60" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2" transform="rotate(15 130 480)"/>
  <rect x="1000" y="80" width="80" height="80" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2" transform="rotate(-20 1040 120)"/>
  
  <!-- Accent line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">
    AI Tools Daily
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    November 23, 2026  •  Local agents, defense autonomy, consumer push
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">
    <rect x="100" y="370" width="140" height="32" rx="16" fill="#238636" opacity="0.2"/>
    <text x="170" y="392" fill="#3fb950" text-anchor="middle" dominant-baseline="middle">11 new tools</text>
    
    <rect x="320" y="370" width="160" height="32" rx="16" fill="#58a6ff" opacity="0.2"/>
    <text x="400" y="392" fill="#58a6ff" text-anchor="middle" dominant-baseline="middle">4 open source</text>
    
    <rect x="560" y="370" width="180" height="32" rx="16" fill="#a371f7" opacity="0.2"/>
    <text x="650" y="392" fill="#a371f7" text-anchor="middle" dominant-baseline="middle">3 defense/vertical</text>
    
    <rect x="820" y="370" width="160" height="32" rx="16" fill="#f78166" opacity="0.2"/>
    <text x="900" y="392" fill="#f78166" text-anchor="middle" dominant-baseline="middle">4 consumer/enterprise</text>
  </g>
  
  <!-- Bottom accent -->
  <line x1="100" y1="450" x2="1100" y2="450" stroke="#30363d" stroke-width="1"/>
  
  <text x="100" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">
    SoreQen Code • Eclipse Enclave • LocalCode • Saab Fighter Agents • Alice AI Do it! • Superhuman Go
  </text>
  
  <text x="100" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">
    PagerDuty Paige • Hercules Agents • Pantheon Web Agent • Sber GigaAgent • Qwen Code 1.0
  </text>
  
  <!-- Corner decoration -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M 50 50 L 50 120 M 50 50 L 120 50"/>
    <path d="M 1150 50 L 1150 120 M 1150 50 L 1080 50"/>
    <path d="M 50 580 L 50 510 M 50 580 L 120 580"/>
    <path d="M 1150 580 L 1150 510 M 1150 580 L 1080 580"/>
  </g>
</svg>