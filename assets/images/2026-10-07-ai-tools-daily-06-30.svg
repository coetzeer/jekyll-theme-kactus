<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#accentGrad)" opacity="0.03"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="430" x2="300" y2="430" stroke="#30363d" stroke-width="1"/>
  <circle cx="950" cy="150" r="200" fill="#58a6ff" opacity="0.08"/>
  <circle cx="950" cy="150" r="120" fill="#a371f7" opacity="0.06"/>
  <circle cx="1100" cy="500" r="180" fill="#f78166" opacity="0.07"/>
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">AI Tools Daily</text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">October 7, 2026 — Eight new drops</text>
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">Coding agents · Long-running agents · Harnesses</text>
  <rect x="100" y="400" width="200" height="3" fill="url(#accentGrad)"/>
