<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.45"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>
  
  <!-- Subtle grid pattern -->
  <g fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  
  <!-- Accent line -->
  <line x1="150" y1="315" x2="1050" y2="315" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="315" r="4" fill="#58a6ff" opacity="0.7"/>
  <circle cx="1050" cy="315" r="4" fill="#a371f7" opacity="0.7"/>
  <circle cx="600" cy="315" r="3" fill="#58a6ff" opacity="0.5"/>
  
  <!-- Title text -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">The Light Falls Differently</text>
  <text x="600" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#ffffff" letter-spacing="-0.3px">on a Saturday in September</text>
  
  <!-- Subtitle/category -->
  <text x="600" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">James Joyce · Daily Observations · 12 September 2026</text>
  
  <!-- Bottom accent elements -->
  <g fill="none" stroke="#30363d" stroke-width="1" opacity="0.4">
    <path d="M 300 500 Q 450 460 600 500 T 900 500"/>
    <path d="M 200 540 Q 350 560 500 540 T 800 540" stroke-width="0.5"/>
  </g>
  
  <!-- Small geometric marks suggesting rain/light -->
  <g fill="#58a6ff" opacity="0.15">
    <ellipse cx="200" cy="150" rx="60" ry="20" transform="rotate(-15 200 150)"/>
    <ellipse cx="1000" cy="180" rx="40" ry="15" transform="rotate(10 1000 180)"/>
    <ellipse cx="400" cy="500" rx="50" ry="18" transform="rotate(5 400 500)"/>
  </g>
</svg>