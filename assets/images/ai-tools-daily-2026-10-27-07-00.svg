<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="url(#accentGradient2)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="1150" cy="100" r="40" fill="url(#accentGradient)" opacity="0.2"/>
  <circle cx="50" cy="530" r="60" fill="url(#accentGradient2)" opacity="0.15"/>
  
  <!-- Title area -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Category label -->
    <text x="100" y="180" font-size="18" font-weight="500" fill="#8b949e" letter-spacing="2" text-transform="uppercase">AI Tools Daily</text>
    
    <!-- Main title -->
    <text x="100" y="260" font-size="48" font-weight="700" fill="#ffffff" line-height="1.2">
      <tspan x="100" dy="0">Seven new tools</tspan>
      <tspan x="100" dy="56">since Oct 23</tspan>
    </text>
    
    <!-- Date -->
    <text x="100" y="360" font-size="24" font-weight="400" fill="#8b949e">October 27, 2026</text>
    
    <!-- Tag badges -->
    <g font-size="14" font-weight="500">
      <!-- Coding agents badge -->
      <rect x="100" y="400" width="140" height="32" rx="16" fill="url(#accentGradient)" opacity="0.2"/>
      <text x="170" y="422" fill="#58a6ff" text-anchor="middle">4 coding agents</text>
      
      <!-- Long-running agents badge -->
      <rect x="100" y="445" width="180" height="32" rx="16" fill="url(#accentGradient2)" opacity="0.2"/>
      <text x="190" y="467" fill="#f78166" text-anchor="middle">1 long-running agent</text>
      
      <!-- Frameworks badge -->
      <rect x="100" y="490" width="160" height="32" rx="16" fill="#30363d"/>
      <text x="180" y="512" fill="#8b949e" text-anchor="middle">2 frameworks</text>
    </g>
  </g>
  
  <!-- Right side: tool icons/names -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3">
    <text x="750" y="200" font-weight="600" fill="#58a6ff">Kimi K3.1 Pro</text>
    <text x="750" y="230" font-size="14" fill="#8b949e">2.8T MoE • 1M ctx • Open weights</text>
    
    <text x="750" y="275" font-weight="600" fill="#a371f7">Nanbeige4.3-33B</text>
    <text x="750" y="305" font-size="14" fill="#8b949e">33B dense • 80.9 Terminal-Bench</text>
    
    <text x="750" y="350" font-weight="600" fill="#f78166">Agent S4</text>
    <text x="750" y="380" font-size="14" fill="#8b949e">Computer-use • Evolving interfaces</text>
    
    <text x="750" y="425" font-weight="600" fill="#3fb950">Gemini API CLI</text>
    <text x="750" y="455" font-size="14" fill="#8b949e">Multimodal from terminal</text>
    
    <text x="750" y="500" font-weight="600" fill="#8b949e">Moli Browser</text>
    <text x="750" y="530" font-size="14" fill="#8b949e">Rust headless for agents</text>
    
    <text x="750" y="575" font-weight="600" fill="#58a6ff">TanStack AI 1.0</text>
    <text x="750" y="605" font-size="14" fill="#8b949e">76 packages • Agent harness</text>
  </g>
  
  <!-- Mistral badge bottom right -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="950" y="560" width="220" height="50" rx="8" fill="url(#accentGradient)" opacity="0.15" stroke="url(#accentGradient)" stroke-width="1"/>
    <text x="1060" y="592" font-size="16" font-weight="600" fill="#a371f7" text-anchor="middle">Mistral Large 4</text>
    <text x="1060" y="612" font-size="12" fill="#8b949e" text-anchor="middle">1T params • 52B active • EU-trained</text>
  </g>
</svg>