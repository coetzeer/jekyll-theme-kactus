<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080c10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="100" rx="400" ry="150" fill="url(#lightGradient)"/>
  
  <!-- Georgian window suggestion - vertical lines -->
  <g stroke="#30363d" stroke-width="1.5" opacity="0.4">
    <line x1="200" y1="400" x2="200" y2="580"/>
    <line x1="300" y1="380" x2="300" y2="580"/>
    <line x1="400" y1="360" x2="400" y2="580"/>
    <line x1="500" y1="350" x2="500" y2="580"/>
    <line x1="700" y1="350" x2="700" y2="580"/>
    <line x1="800" y1="360" x2="800" y2="580"/>
    <line x1="900" y1="380" x2="900" y2="580"/>
    <line x1="1000" y1="400" x2="1000" y2="580"/>
  </g>
  
  <!-- Horizontal window bars -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="180" y1="450" x2="1020" y2="450"/>
    <line x1="180" y1="500" x2="1020" y2="500"/>
    <line x1="180" y1="550" x2="1020" y2="550"/>
  </g>
  
  <!-- Light catching window panes -->
  <g fill="#58a6ff" opacity="0.15">
    <rect x="190" y="410" width="80" height="40" rx="2"/>
    <rect x="310" y="390" width="80" height="40" rx="2"/>
    <rect x="510" y="370" width="80" height="40" rx="2"/>
    <rect x="710" y="370" width="80" height="40" rx="2"/>
    <rect x="910" y="390" width="80" height="40" rx="2"/>
    <rect x="1010" y="410" width="80" height="40" rx="2"/>
  </g>
  
  <!-- Dust motes in light -->
  <g fill="#a371f7" opacity="0.6">
    <circle cx="350" cy="200" r="1.5"/>
    <circle cx="420" cy="180" r="1"/>
    <circle cx="580" cy="220" r="1.5"/>
    <circle cx="650" cy="190" r="1"/>
    <circle cx="720" cy="210" r="1.5"/>
    <circle cx="800" cy="170" r="1"/>
    <circle cx="480" cy="250" r="1"/>
    <circle cx="680" cy="260" r="1.5"/>
  </g>
  
  <!-- Temperature text - subtle -->
  <text x="1150" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="end" opacity="0.5">7.9°C</text>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">The Weight of a Clear Morning</text>
  
  <!-- Subtitle -->
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" font-weight="300">Dublin · October 8, 2026 · 07:04</text>
  
  <!-- Thin decorative line -->
  <line x1="400" y1="360" x2="800" y2="360" stroke="#30363d" stroke-width="1"/>
  
  <!-- Author -->
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle" font-style="italic">James Joyce</text>
</svg>