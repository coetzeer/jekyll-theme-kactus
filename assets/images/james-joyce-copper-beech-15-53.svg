<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric decoration -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <rect x="50" y="500" width="200" height="1" fill="url(#accentGrad)"/>
  <rect x="950" y="80" width="180" height="1" fill="url(#accentGrad)"/>
  
  <!-- Decorative wave line -->
  <path d="M 0 315 Q 300 280 600 315 T 1200 315" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" dominant-baseline="middle">The City Speaks in Fragments</text>
  
  <!-- Subtitle -->
  <text x="600" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">Daily observations & epiphanies</text>
  
  <!-- Date line -->
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle" dominant-baseline="middle">24 August 2026</text>
  
  <!-- Small decorative elements -->
  <circle cx="580" cy="430" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="620" cy="430" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="445" r="2" fill="#58a6ff" opacity="0.4"/>
</svg>