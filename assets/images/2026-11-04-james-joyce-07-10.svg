<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <rect x="50" y="500" width="200" height="1" fill="#30363d" opacity="0.3"/>
  <rect x="950" y="80" width="200" height="1" fill="#30363d" opacity="0.3"/>
  
  <!-- Accent line -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Title -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5px">Mainly Clear</text>
  
  <!-- Subtitle -->
  <text x="100" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">A November morning in Dublin</text>
  
  <!-- Date line -->
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">04 November 2026  •  07:10</text>
  
  <!-- Decorative waves at bottom -->
  <path d="M0,580 Q300,550 600,580 T1200,580 L1200,630 L0,630 Z" fill="#161b22" opacity="0.5"/>
  <path d="M0,600 Q300,570 600,600 T1200,600 L1200,630 L0,630 Z" fill="#0d1117" opacity="0.3"/>
  
  <!-- Small accent dots -->
  <circle cx="200" cy="480" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="220" cy="480" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="240" cy="480" r="3" fill="#f78166" opacity="0.6"/>
</svg>