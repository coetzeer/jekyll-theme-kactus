<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa657;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6edf3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b949e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="120" r="80" fill="#f78166" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="120" fill="#ffa657" opacity="0.04" filter="url(#glow)"/>
  <circle cx="900" cy="80" r="60" fill="#58a6ff" opacity="0.05" filter="url(#glow)"/>
  
  <!-- Bond yield chart visualization -->
  <g transform="translate(100, 200)">
    <path d="M0,200 Q50,180 100,190 Q150,160 200,170 Q250,140 300,150 Q350,120 400,130 Q450,100 500,110 Q550,80 600,90 Q650,70 700,80" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Yield markers -->
    <circle cx="100" cy="190" r="5" fill="#f78166"/>
    <circle cx="300" cy="150" r="5" fill="#ffa657"/>
    <circle cx="500" cy="110" r="5" fill="#f78166"/>
    <circle cx="700" cy="80" r="5" fill="#ffa657"/>
    <!-- Labels -->
    <text x="100" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">10Y</text>
    <text x="300" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">20Y</text>
    <text x="500" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">30Y</text>
    <text x="700" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Peak</text>
  </g>
  
  <!-- Regional indicators -->
  <g transform="translate(850, 200)">
    <rect x="0" y="0" width="250" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="125" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">YIELD SNAPSHOT</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#e6edf3">
      <text x="20" y="65" text-anchor="start">US 10Y: <tspan fill="#f78166" font-weight="600">4.70%</tspan></text>
      <text x="20" y="90" text-anchor="start">US 30Y: <tspan fill="#f78166" font-weight="600">5.28%</tspan></text>
      <text x="20" y="115" text-anchor="start">UK 10Y: <tspan fill="#ffa657" font-weight="600">5.05%</tspan></text>
      <text x="20" y="140" text-anchor="start">DE 10Y: <tspan fill="#58a6ff" font-weight="600">3.26%</tspan></text>
      <text x="20" y="165" text-anchor="start">FR 10Y: <tspan fill="#f78166" font-weight="600">4.10%</tspan></text>
    </g>
  </g>
  
  <!-- Title area -->
  <g transform="translate(100, 80)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">Bond Markets on Edge</text>
    <text x="0" y="48" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#8b949e">Global Selloff Driven by War, Debt & Central Bank Uncertainty</text>
    <line x1="0" y1="68" x2="300" y2="68" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Date and category -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#6e7681">2-DAY RETROSPECTIVE • AUGUST 22, 2026</text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#6e7681">US TREASURIES • UK GILTS • EUROPEAN BUNDS</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="540" x2="1100" y2="540" stroke="#21262d" stroke-width="1" stroke-dasharray="8,4"/>
  
  <!-- Small decorative triangles -->
  <polygon points="100,540 110,530 110,550" fill="#f78166" opacity="0.6"/>
  <polygon points="1100,540 1090,530 1090,550" fill="#ffa657" opacity="0.6"/>
</svg>
