<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="url(#accentGrad)" opacity="0.08"/>
  <circle cx="1050" cy="480" r="120" fill="url(#accentGrad)" opacity="0.06"/>
  <circle cx="1100" cy="100" r="60" fill="#58a6ff" opacity="0.1"/>
  <circle cx="100" cy="530" r="40" fill="#a371f7" opacity="0.1"/>
  
  <!-- Top accent line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">
    AI Tools Landscape
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e">
    The Three-Category Reality
  </text>
  
  <!-- Date/Category -->
  <text x="600" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff">
    August 2026  •  Coding Agents, Long-Running Agents, Frameworks
  </text>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Category pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">
    <!-- IDE Agents pill -->
    <rect x="300" y="400" width="180" height="44" rx="22" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="390" y="429" text-anchor="middle" fill="#58a6ff" font-weight="600">IDE Agents</text>
    
    <!-- Terminal Agents pill -->
    <rect x="510" y="400" width="180" height="44" rx="22" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="600" y="429" text-anchor="middle" fill="#a371f7" font-weight="600">Terminal Agents</text>
    
    <!-- Autonomous pill -->
    <rect x="720" y="400" width="180" height="44" rx="22" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="810" y="429" text-anchor="middle" fill="#f78166" font-weight="600">Autonomous</text>
  </g>
  
  <!-- Tool icons/logos row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6e7681">
    <text x="200" y="500" text-anchor="middle">Cursor</text>
    <text x="350" y="500" text-anchor="middle">Windsurf</text>
    <text x="500" y="500" text-anchor="middle">Claude Code</text>
    <text x="650" y="500" text-anchor="middle">OpenHands</text>
    <text x="800" y="500" text-anchor="middle">Aider</text>
    <text x="950" y="500" text-anchor="middle">Devin</text>
  </g>
  
  <!-- Small decorative dots -->
  <g fill="#30363d">
    <circle cx="200" cy="460" r="3"/>
    <circle cx="350" cy="460" r="3"/>
    <circle cx="500" cy="460" r="3"/>
    <circle cx="650" cy="460" r="3"/>
    <circle cx="800" cy="460" r="3"/>
    <circle cx="950" cy="460" r="3"/>
  </g>
</svg>