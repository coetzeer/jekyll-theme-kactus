<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; }
      .accent-line { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .accent-line-alt { stroke: #a371f7; stroke-width: 1.5; stroke-dasharray: 8 4; fill: none; }
      .decor-circle { fill: none; stroke: #30363d; stroke-width: 1; }
      .decor-circle-accent { fill: none; stroke: #58a6ff; stroke-width: 0.8; opacity: 0.4; }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="520" />
  
  <!-- Subtle atmospheric gradient -->
  <rect x="0" y="0" width="1400" height="520" fill="url(#grad2)" />
  <rect x="0" y="0" width="1400" height="520" fill="url(#grad1)" />
  
  <!-- Decorative circles -->
  <circle class="decor-circle" cx="150" cy="150" r="80" />
  <circle class="decor-circle-accent" cx="150" cy="150" r="120" />
  <circle class="decor-circle" cx="1250" cy="370" r="60" />
  <circle class="decor-circle-accent" cx="1250" cy="370" r="95" />
  <circle class="decor-circle" cx="700" cy="480" r="40" />
  
  <!-- Thin accent lines -->
  <line class="accent-line" x1="100" y1="80" x2="300" y2="80" />
  <line class="accent-line-alt" x1="100" y1="440" x2="400" y2="440" />
  <line class="accent-line" x1="1100" y1="80" x2="1300" y2="80" />
  <line class="accent-line-alt" x1="1000" y1="440" x2="1300" y2="440" />
  
  <!-- Title -->
  <text x="700" y="240" text-anchor="middle" class="title">Clear Sky Over Dublin</text>
  <text x="700" y="290" text-anchor="middle" class="subtitle">October 30, 2026 — 07:01</text>
  
  <!-- Subtle tagline -->
  <text x="700" y="400" text-anchor="middle" style="fill:#484f58; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px;">The light falls different this time of year</text>
</svg>