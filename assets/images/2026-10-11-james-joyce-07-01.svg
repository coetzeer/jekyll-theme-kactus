<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0d12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture - noise-like circles -->
  <g opacity="0.03">
    <circle cx="150" cy="120" r="80" fill="#58a6ff"/>
    <circle cx="950" cy="500" r="120" fill="#a371f7"/>
    <circle cx="600" cy="300" r="200" fill="#58a6ff"/>
    <circle cx="300" cy="450" r="60" fill="#a371f7"/>
    <circle cx="1000" cy="100" r="90" fill="#58a6ff"/>
  </g>
  
  <!-- Light pool - the overcast morning glow -->
  <ellipse cx="600" cy="180" rx="400" ry="150" fill="url(#lightPool)"/>
  
  <!-- Horizontal accent line -->
  <line x1="200" y1="280" x2="1000" y2="280" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="281" x2="1000" y2="281" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="330" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Weight of an Overcast Morning
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    October 11, 2026 · Dublin
  </text>
  
  <!-- Decorative elements - subtle geometric marks -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.4">
    <rect x="400" y="420" width="400" height="1" />
    <circle cx="500" cy="440" r="3" fill="#58a6ff" opacity="0.6"/>
    <circle cx="700" cy="440" r="3" fill="#a371f7" opacity="0.6"/>
    <circle cx="600" cy="440" r="2" fill="#58a6ff" opacity="0.8"/>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="500" y1="520" x2="700" y2="520" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="521" x2="680" y2="521" stroke="#58a6ff" stroke-width="1" opacity="0.4"/>
  
  <!-- Category tag -->
  <text x="600" y="560" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#58a6ff" text-anchor="middle" letter-spacing="2px" opacity="0.7">
    JAMES JOYCE · DAILY OBSERVATIONS
  </text>
</svg>