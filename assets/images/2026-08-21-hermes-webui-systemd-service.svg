<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
      .label { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .dashed { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="520" />
  
  <!-- Header -->
  <text x="700" y="36" text-anchor="middle" class="title">Hermes WebUI — Systemd Service Architecture</text>
  <text x="700" y="56" text-anchor="middle" class="sub">supervised foreground process · DBus session routing · automatic lifecycle recovery</text>

  <!-- Left: Client / Browser -->
  <g transform="translate(100, 160)">
    <rect class="panel" x="0" y="0" width="240" height="180" />
    <text x="120" y="30" text-anchor="middle" class="label">User Browser</text>
    <rect x="20" y="55" width="200" height="30" fill="#3b82f6" rx="4" />
    <text x="120" y="74" text-anchor="middle" class="code" fill="#ffffff">http://localhost:8787</text>
    <text x="120" y="115" text-anchor="middle" class="sub">Local / Tunneled Access</text>
    <text x="120" y="130" text-anchor="middle" class="sub">React / CSS / SSE Chat</text>
  </g>

  <!-- Middle Left: Systemd User Instance -->
  <g transform="translate(440, 100)">
    <rect class="panel" x="0" y="0" width="340" height="300" />
    <text x="170" y="30" text-anchor="middle" class="label" fill="#f97316">Systemd User Manager</text>
    <text x="170" y="48" text-anchor="middle" class="sub">systemd --user (UID 1000)</text>

    <!-- Sub-block: DBus session -->
    <rect x="20" y="75" width="300" height="80" fill="#0f172a" stroke="#475569" rx="6" />
    <text x="170" y="98" text-anchor="middle" class="label">D-Bus Session Bus</text>
    <text x="170" y="120" text-anchor="middle" class="code">/run/user/1000/bus</text>
    <text x="170" y="138" text-anchor="middle" class="sub" fill="#10b981">Enabled via loginctl linger</text>

    <!-- Sub-block: service config -->
    <rect x="20" y="175" width="300" height="100" fill="#1e293b" stroke="#f97316" rx="6" />
    <text x="170" y="198" text-anchor="middle" class="label" fill="#f97316">hermes-webui.service</text>
    <text x="170" y="220" text-anchor="middle" class="code">Type=simple</text>
    <text x="170" y="238" text-anchor="middle" class="code">Restart=on-failure</text>
    <text x="170" y="255" text-anchor="middle" class="code">KillMode=control-group</text>
  </g>

  <!-- Middle Right: WebUI Bootstrap Process -->
  <g transform="translate(880, 130)">
    <rect class="panel" x="0" y="0" width="420" height="240" />
    <text x="210" y="30" text-anchor="middle" class="label" fill="#8b5cf6">Hermes WebUI Application</text>
    
    <!-- Sub-block: bootstrap.py -->
    <rect x="20" y="60" width="380" height="65" fill="#0f172a" stroke="#8b5cf6" rx="6" />
    <text x="210" y="80" text-anchor="middle" class="label">bootstrap.py --foreground</text>
    <text x="210" y="100" text-anchor="middle" class="sub" fill="#cbd5e1">Auto-promoted by INVOCATION_ID</text>

    <!-- Sub-block: server.py -->
    <rect x="20" y="145" width="380" height="70" fill="#0f172a" stroke="#10b981" rx="6" />
    <text x="210" y="165" text-anchor="middle" class="label" fill="#10b981">server.py (FastAPI / uvicorn)</text>
    <text x="210" y="185" text-anchor="middle" class="code">PID 2062721 (Main PID tracked)</text>
    <text x="210" y="198" text-anchor="middle" class="sub">Port: 8787 | State: ~/.hermes/webui</text>
  </g>

  <!-- Flow arrows -->
  <!-- Browser to Server (HTTP/SSE) -->
  <path class="arrow" d="M340,250 L430,250" />
  <path class="arrow" d="M780,250 L870,250" />
  
  <text x="385" y="240" text-anchor="middle" class="sub">HTTP</text>
  <text x="825" y="240" text-anchor="middle" class="sub">Spawns</text>

  <!-- Linger control from DBus to User Manager -->
  <path class="dashed" d="M610,155 L610,175" />

  <!-- Legend at bottom -->
  <g transform="translate(350, 450)">
    <rect x="0" y="0" width="15" height="15" fill="#3b82f6" rx="3" />
    <text x="25" y="12" class="sub">Client UI</text>
    
    <rect x="150" y="0" width="15" height="15" fill="#f97316" rx="3" />
    <text x="175" y="12" class="sub">System Service</text>

    <rect x="330" y="0" width="15" height="15" fill="#8b5cf6" rx="3" />
    <text x="355" y="12" class="sub">App Wrapper</text>

    <rect x="510" y="0" width="15" height="15" fill="#10b981" rx="3" />
    <text x="535" y="12" class="sub">Core Engine / Storage</text>
  </g>
</svg>
