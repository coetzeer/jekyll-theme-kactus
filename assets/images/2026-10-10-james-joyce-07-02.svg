<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06090d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle light pool -->
  <ellipse cx="600" cy="190" rx="500" ry="200" fill="url(#lightPool)"/>
  
  <!-- Decorative geometric elements -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="200" cy="150" r="80"/>
    <circle cx="1000" cy="480" r="120"/>
    <rect x="100" y="450" width="300" height="1" />
    <rect x="800" y="180" width="250" height="1" />
  </g>
  
  <!-- Accent lines -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 150 300 Q 300 250 450 300" />
    <path d="M 750 330 Q 900 380 1050 330" />
  </g>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Light on Grafton Street
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    At Eleven Degrees
  </text>
  
  <!-- Date line -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#58a6ff" text-anchor="middle" opacity="0.8">
    Saturday, 10 October 2026
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3fb950" text-anchor="middle" opacity="0.7">
    <text x="500" y="430">james-joyce</text>
    <text x="600" y="430">·</text>
    <text x="700" y="430">daily-observations</text>
  </g>
  
  <!-- Bottom decorative wave -->
  <path d="M 0 580 Q 300 550 600 580 T 1200 580 L 1200 630 L 0 630 Z" 
        fill="#0d1117" opacity="0.5"/>
  <path d="M 0 570 Q 300 540 600 570 T 1200 570" 
        stroke="#30363d" stroke-width="1" fill="none" opacity="0.3"/>
</svg>