<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coral-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa657;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#accent-gradient)" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="url(#coral-gradient)" stroke-width="1" opacity="0.2"/>
  <rect x="50" y="500" width="200" height="2" fill="url(#accent-gradient)" opacity="0.4"/>
  <rect x="950" y="80" width="150" height="1" fill="url(#coral-gradient)" opacity="0.4"/>
  
  <!-- Date badge -->
  <rect x="80" y="80" width="180" height="40" rx="20" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="170" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="middle">Sep 26, 2026</text>
  
  <!-- Category badge -->
  <rect x="940" y="80" width="180" height="40" rx="20" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1030" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8b949e" text-anchor="middle">AI Tools Daily</text>
  
  <!-- Main title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">AI Tools Daily</text>
  
  <!-- Subtitle -->
  <text x="600" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e" text-anchor="middle">September 26, 2026</text>
  
  <!-- Divider line -->
  <line x1="450" y1="370" x2="750" y2="370" stroke="url(#accent-gradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Topic tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">
    <text x="480" y="420" fill="#58a6ff">Microsoft Copilot</text>
    <text x="720" y="420" fill="#a371f7">Honest Associate</text>
    <text x="600" y="460" fill="#f78166">Tencent Hy4</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#30363d" stroke-width="1"/>
  
  <!-- Source attribution -->
  <text x="600" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58" text-anchor="middle">coetzeer.github.io/jekyll-theme-kactus</text>
</svg>