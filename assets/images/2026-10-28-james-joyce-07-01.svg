<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric pattern -->
  <g stroke="#30363d" stroke-width="0.5" fill="none" opacity="0.3">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="150" r="30" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.4"/>
  <circle cx="1050" cy="480" r="80" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="480" r="40" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Wave line -->
  <path d="M 0 380 Q 300 340 600 380 T 1200 380" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 0 420 Q 300 460 600 420 T 1200 420" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.3"/>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">The Weight of Light on Coolock Roads</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">October 28, 2026 · James Joyce · Daily Observations</text>
  
  <!-- Decorative separator -->
  <line x1="500" y1="365" x2="700" y2="365" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Small accent marks -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.5">
    <line x1="490" y1="360" x2="490" y2="370"/>
    <line x1="710" y1="360" x2="710" y2="370"/>
  </g>
  
  <!-- Bottom atmospheric element -->
  <ellipse cx="600" cy="650" rx="400" ry="100" fill="url(#accentGrad)" opacity="0.03"/>
</svg>