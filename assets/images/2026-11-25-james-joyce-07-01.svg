<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric decoration - circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="480" r="150" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Subtle lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="url(#accentGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="url(#accentGrad)" stroke-width="1" opacity="0.1"/>
  
  <!-- Small accent rectangles -->
  <rect x="100" y="300" width="4" height="60" fill="url(#accentGrad)" opacity="0.4"/>
  <rect x="1100" y="270" width="4" height="40" fill="url(#accentGrad)" opacity="0.3"/>
  <rect x="300" y="500" width="60" height="3" fill="url(#accentGrad)" opacity="0.2"/>
  <rect x="840" y="130" width="40" height="3" fill="url(#accentGrad)" opacity="0.2"/>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" letter-spacing="0.5">
    The Light Falls Different
  </text>
  <text x="600" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" letter-spacing="0.5">
    on Phibsborough
  </text>
  
  <!-- Subtitle / category -->
  <text x="600" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" font-weight="400">
    James Joyce · Daily Observations · November 25, 2026
  </text>
  
  <!-- Decorative wave line -->
  <path d="M 400 360 Q 500 350 600 360 T 800 360" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 450 370 Q 550 380 650 370 T 850 370" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Bottom accent -->
  <line x1="500" y1="460" x2="700" y2="460" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
</svg>