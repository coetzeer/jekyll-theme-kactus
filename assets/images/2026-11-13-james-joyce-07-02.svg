<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6edf3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="500" r="40" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="1000" cy="130" r="60" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.15"/>

  <!-- Thin decorative lines -->
  <line x1="150" y1="200" x2="400" y2="200" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4"/>
  <line x1="800" y1="430" x2="1050" y2="430" stroke="#a371f7" stroke-width="1" opacity="0.3"/>

  <!-- Small accent dots -->
  <circle cx="180" cy="200" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="380" cy="200" r="1.5" fill="#a371f7" opacity="0.5"/>
  <circle cx="820" cy="430" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="1030" cy="430" r="1.5" fill="#58a6ff" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#titleGradient)" letter-spacing="-0.5px">
    The City Wakes Cold
  </text>

  <!-- Subtitle/category -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" font-weight="400">
    James Joyce — Daily Observations
  </text>

  <!-- Date line -->
  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" font-weight="400">
    13 November 2026  •  2.8°C  •  Clear Sky
  </text>

  <!-- Bottom decorative wave -->
  <path d="M100,520 Q300,480 600,520 T1100,520" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>

  <!-- Small frost-like crystals -->
  <g fill="#58a6ff" opacity="0.4">
    <polygon points="50,580 53,574 59,576 54,580 56,586 50,582 44,586 46,580 41,576 47,574"/>
    <polygon points="1150,580 1152,575 1157,577 1153,580 1155,585 1150,582 1145,585 1147,580 1142,577 1148,575" transform="scale(0.6) translate(100, 200)"/>
    <polygon points="300,580 303,574 309,576 304,580 306,586 300,582 294,586 296,580 291,576 297,574" transform="scale(0.5) translate(200, 300)"/>
  </g>
</svg>