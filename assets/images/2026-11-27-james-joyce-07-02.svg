<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0d12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric circles -->
  <circle cx="200" cy="150" r="180" fill="url(#glowGradient)" opacity="0.3"/>
  <circle cx="1000" cy="480" r="220" fill="#a371f7" opacity="0.08"/>
  <circle cx="600" cy="315" r="300" fill="#58a6ff" opacity="0.04"/>
  
  <!-- Horizontal line accents -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <line x1="900" y1="430" x2="1100" y2="430" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">The Light That Failed to Arrive</text>
  
  <!-- Subtitle line -->
  <line x1="450" y1="310" x2="750" y2="310" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Date/category -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle" font-weight="400">November 27, 2026  •  James Joyce  •  Daily Observations</text>
  
  <!-- Decorative elements - small geometric accents -->
  <rect x="570" y="370" width="60" height="2" fill="#58a6ff" opacity="0.6"/>
  <rect x="560" y="378" width="80" height="1" fill="#a371f7" opacity="0.4"/>
  <rect x="550" y="386" width="100" height="1" fill="#f78166" opacity="0.3"/>
  
  <!-- Weather hint - subtle temperature -->
  <text x="600" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle" opacity="0.7">8.8°C  •  Overcast  •  Dublin</text>
  
  <!-- Bottom accent line -->
  <line x1="500" y1="520" x2="700" y2="520" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  
  <!-- Small circles for texture -->
  <circle cx="300" cy="550" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="340" cy="560" r="1.5" fill="#a371f7" opacity="0.3"/>
  <circle cx="860" cy="555" r="2" fill="#f78166" opacity="0.3"/>
  <circle cx="900" cy="565" r="1.5" fill="#58a6ff" opacity="0.3"/>
</svg>