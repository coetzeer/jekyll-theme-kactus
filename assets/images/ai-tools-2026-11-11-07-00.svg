<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6edf3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="550" r="60" fill="none" stroke="#f78166" stroke-width="1" opacity="0.12"/>
  <circle cx="1050" cy="80" r="40" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.1"/>
  
  <!-- Accent line -->
  <line x1="100" y1="180" x2="300" y2="180" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Title -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)">
    AI Tools Daily Update
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    November 11, 2026
  </text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <rect x="100" y="325" width="140" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="108" y="345" fill="#58a6ff" font-weight="600">Enterprise Infra</text>
    
    <rect x="255" y="325" width="110" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="263" y="345" fill="#a371f7" font-weight="600">Coordination</text>
    
    <rect x="380" y="325" width="85" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="388" y="345" fill="#f78166" font-weight="600">Models</text>
    
    <rect x="480" y="325" width="75" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="488" y="345" fill="#3fb950" font-weight="600">Safety</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#30363d" stroke-width="1"/>
  
  <!-- Footer text -->
  <text x="100" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6e7681">
    coetzeer.github.io/jekyll-theme-kactus  •  AI Tools Daily
  </text>
</svg>