<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.1"/>
  <circle cx="300" cy="550" r="40" fill="none" stroke="#f78166" stroke-width="1" opacity="0.2"/>
  <circle cx="900" cy="80" r="60" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.15"/>
  
  <!-- Top accent line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" letter-spacing="0.5px">
    The Grey Morning
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    and the Book Festival's Promise
  </text>
  
  <!-- Date/category line -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6e7681" text-anchor="middle">
    31 October 2026  •  Dublin  •  10.2°C  •  Overcast
  </text>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Small decorative elements -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="1000" cy="430" r="2"/>
    <circle cx="400" cy="500" r="2.5"/>
    <circle cx="800" cy="130" r="2"/>
  </g>
  
  <!-- Wave decoration at bottom -->
  <path d="M0,630 Q300,580 600,630 T1200,630" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
</svg>