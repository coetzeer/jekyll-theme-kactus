<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle geometric decoration - top line -->
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#30363d" stroke-width="1" stroke-dasharray="10,5"/>

  <!-- Decorative circles - subtle -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="0.5" opacity="0.12"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#3fb950" stroke-width="0.3" opacity="0.08"/>

  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="0.5">The Weight of Light on the Liffey</text>

  <!-- Subtitle line -->
  <line x1="400" y1="310" x2="800" y2="310" stroke="#58a6ff" stroke-width="2"/>

  <!-- Category/date -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">James Joyce · Daily Observations · 29 October 2026</text>

  <!-- Bottom decorative line -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#30363d" stroke-width="1" stroke-dasharray="10,5"/>

  <!-- Small accent dots -->
  <circle cx="300" cy="550" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="550" r="3" fill="#a371f7" opacity="0.6"/>
  <circle cx="900" cy="550" r="3" fill="#f78166" opacity="0.6"/>

  <!-- Subtle wave at bottom -->
  <path d="M0,630 Q300,580 600,630 T1200,630" fill="url(#accentGradient)" opacity="0.15"/>
</svg>