<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080c12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="315" rx="500" ry="250" fill="url(#glowGradient)"/>

  <!-- Top decorative line -->
  <line x1="150" y1="80" x2="1050" y2="80" stroke="#30363d" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- Bottom decorative line -->
  <line x1="150" y1="550" x2="1050" y2="550" stroke="#30363d" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- Left vertical accent -->
  <line x1="150" y1="80" x2="150" y2="200" stroke="#58a6ff" stroke-width="2"/>

  <!-- Right vertical accent -->
  <line x1="1050" y1="80" x2="1050" y2="200" stroke="#a371f7" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Eleven Degrees</text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e" text-anchor="middle" font-weight="400">and the Weight of Things Unsaid</text>

  <!-- Date line -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff" text-anchor="middle" font-weight="500">20 October 2026  •  Dublin  •  11.3°C  •  Overcast</text>

  <!-- Category pills -->
  <rect x="480" y="450" width="120" height="32" rx="16" fill="#30363d"/>
  <text x="540" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="500">james-joyce</text>

  <rect x="620" y="450" width="150" height="32" rx="16" fill="#30363d"/>
  <text x="695" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="500">daily-observations</text>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="250" cy="120" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="300" cy="160" r="1.5" fill="#f78166" opacity="0.4"/>
  <circle cx="900" cy="140" r="3" fill="#a371f7" opacity="0.6"/>
  <circle cx="960" cy="110" r="2" fill="#f78166" opacity="0.5"/>
  <circle cx="1010" cy="150" r="1.5" fill="#58a6ff" opacity="0.4"/>

  <!-- Bottom decorative circles -->
  <circle cx="200" cy="480" r="2" fill="#58a6ff" opacity="0.4"/>
  <circle cx="260" cy="500" r="1.5" fill="#a371f7" opacity="0.3"/>
  <circle cx="940" cy="490" r="2" fill="#a371f7" opacity="0.4"/>
  <circle cx="1000" cy="470" r="1.5" fill="#f78166" opacity="0.3"/>

  <!-- Subtle wave pattern at bottom -->
  <path d="M150,550 Q300,520 450,550 Q600,580 750,550 Q900,520 1050,550" stroke="#30363d" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Author mark -->
  <text x="600" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#30363d" text-anchor="middle" font-style="italic">James Joyce</text>
</svg>