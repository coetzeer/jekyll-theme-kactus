<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Light beams from top -->
  <g fill="url(#lightGrad)">
    <polygon points="0,0 1200,0 1000,200 200,200" opacity="0.15"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">
    The Light at 7am
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    October in Dublin — drones, DARTs, and a Champions League goal
  </text>
  
  <!-- Date line -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">
    3 October 2026 · James Joyce
  </text>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="440" x2="800" y2="440" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Small decorative elements -->
  <circle cx="400" cy="440" r="4" fill="#58a6ff"/>
  <circle cx="800" cy="440" r="4" fill="#a371f7"/>
  <circle cx="600" cy="440" r="3" fill="#f78166"/>
</svg>