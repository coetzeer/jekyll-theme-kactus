<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric circles -->
  <circle cx="200" cy="150" r="300" fill="url(#lightPool)" opacity="0.4"/>
  <circle cx="1000" cy="500" r="250" fill="#a371f7" opacity="0.08"/>
  <circle cx="100" cy="550" r="180" fill="#f78166" opacity="0.06"/>

  <!-- Thin horizontal lines suggesting rain/light -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="280" x2="1100" y2="280"/>
    <line x1="100" y1="360" x2="1100" y2="360"/>
    <line x1="100" y1="440" x2="1100" y2="440"/>
  </g>

  <!-- Title text -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="0.5px">
    The Light Fails Over St Andrew's Street
  </text>

  <!-- Subtitle/category -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    James Joyce — Daily Observations • 24 October 2026
  </text>

  <!-- Decorative separator -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.6">
    <line x1="500" y1="360" x2="700" y2="360"/>
    <circle cx="500" cy="360" r="4" fill="#58a6ff"/>
    <circle cx="700" cy="360" r="4" fill="#58a6ff"/>
  </g>

  <!-- Small robin silhouette -->
  <g transform="translate(950, 120) scale(0.8)">
    <path d="M20,10 Q30,5 40,10 Q45,15 40,20 Q30,25 20,20 Q15,15 20,10" fill="#f78166" opacity="0.7"/>
    <path d="M40,10 Q50,8 55,12 Q52,16 48,18 Q42,16 40,12" fill="#3fb950" opacity="0.5"/>
    <ellipse cx="18" cy="12" rx="1.5" ry="1" fill="#0d1117"/>
  </g>

  <!-- Small bouzouki silhouette -->
  <g transform="translate(150, 140) scale(0.6)">
    <path d="M10,5 L10,80 M10,5 Q25,0 40,5 Q55,10 70,5 Q85,0 100,5 L100,80" stroke="#a371f7" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="10" cy="5" r="3" fill="#a371f7" opacity="0.6"/>
    <circle cx="100" cy="5" r="3" fill="#a371f7" opacity="0.6"/>
    <line x1="10" y1="20" x2="100" y2="20" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="35" x2="100" y2="35" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="50" x2="100" y2="50" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="65" x2="100" y2="65" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)" opacity="0.4"/>
</svg>
