<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Nine Degrees and Clear">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="65%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f78166" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f78166" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- low October sun -->
  <circle cx="880" cy="470" r="150" fill="url(#warm)"/>
  <circle cx="880" cy="470" r="46" fill="#f78166" fill-opacity="0.55"/>

  <!-- clean cold light along the horizon -->
  <rect x="0" y="470" width="1200" height="2" fill="#30363d"/>
  <rect x="0" y="472" width="1200" height="120" fill="url(#glow)" opacity="0.25"/>

  <!-- rooftops and railings : flat, exact, drawn -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M0 500 L120 500 L120 452 L200 452 L200 500 L330 500 L330 468 L430 468 L430 500 L560 500 L560 440 L640 440 L640 500 L780 500 L780 460 L860 460 L860 500 L1000 500 L1000 470 L1080 470 L1080 500 L1200 500"/>
    <path d="M60 540 L1140 540"/>
    <path d="M60 552 L1140 552"/>
  </g>
  <g stroke="#30363d" stroke-width="2" fill="none" opacity="0.7">
    <path d="M140 540 L140 520 M160 540 L160 520 M180 540 L180 520 M200 540 L200 520 M220 540 L220 520 M240 540 L240 520 M260 540 L260 520"/>
  </g>

  <!-- wind lines : fourteen kilometres an hour -->
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M90 300 C 250 292, 380 314, 520 302"/>
    <path d="M120 340 C 300 330, 420 352, 600 342"/>
    <path d="M80 380 C 220 372, 340 392, 470 384"/>
  </g>

  <!-- thermometer tick marks : nine degrees -->
  <g stroke="#3fb950" stroke-width="3" opacity="0.85">
    <path d="M120 200 L120 250"/>
    <path d="M120 260 L120 272"/>
    <path d="M120 282 L120 294"/>
    <path d="M120 304 L120 316"/>
  </g>

  <!-- title -->
  <text x="120" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Nine Degrees and Clear</text>
  <text x="122" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Dublin, Friday 16 October 2026 · daily observations</text>

  <rect x="120" y="205" width="120" height="2" fill="#a371f7" opacity="0.8"/>
</svg>
