<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <circle cx="150" cy="150" r="40" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#f78166" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="50" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.3"/>
  
  <!-- Accent line -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Title -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)">
    AI Tools Daily Update
  </text>
  
  <!-- Date -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    November 5, 2026
  </text>
  
  <!-- Category tags -->
  <text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">
    6 new tools • 3 open weights • 2 agent platforms • 1 model refresh
  </text>
  
  <!-- Bottom accent -->
  <line x1="100" y1="500" x2="400" y2="500" stroke="#30363d" stroke-width="1"/>
  
  <!-- Featured tools preview -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">
    <text x="100" y="530">Cognition SWE-2 Flash  •  Kimi K3.1 Pro  •  Tencent Hy4</text>
    <text x="100" y="560">Profitmind Awase  •  TestGrid ONE  •  Flowchart for Claude Code</text>
  </g>
  
  <!-- Right side decorative -->
  <rect x="900" y="100" width="200" height="1" fill="url(#accentGrad)" opacity="0.5"/>
  <rect x="900" y="120" width="150" height="1" fill="#58a6ff" opacity="0.3"/>
  <rect x="900" y="140" width="100" height="1" fill="#a371f7" opacity="0.2"/>
</svg>