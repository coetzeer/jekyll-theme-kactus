<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3447;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a4158;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="riverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e2535;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a3347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e2535;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture -->
  <g opacity="0.04">
    <circle cx="150" cy="120" r="80" fill="#58a6ff"/>
    <circle cx="950" cy="200" r="120" fill="#a371f7"/>
    <circle cx="600" cy="500" r="200" fill="#58a6ff"/>
    <circle cx="1100" cy="550" r="60" fill="#a371f7"/>
  </g>
  
  <!-- River Liffey - curved path across bottom third -->
  <path d="M -50,480 
           Q 200,460 400,480 
           Q 600,500 800,470 
           Q 1000,440 1250,460
           L 1250,630 L -50,630 Z" 
        fill="url(#riverGradient)" 
        opacity="0.8"/>
  
  <!-- River highlight line -->
  <path d="M -50,480 
           Q 200,460 400,480 
           Q 600,500 800,470 
           Q 1000,440 1250,460" 
        stroke="#3fb950" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.4"
        filter="url(#glow)"/>
  
  <!-- Spires/silhouettes along the quays -->
  <g fill="#0d1117" opacity="0.9">
    <!-- Pro-Cathedral spire -->
    <path d="M 280,480 L 275,380 L 285,380 L 280,360 L 275,380 L 285,380 Z"/>
    <rect x="270" y="420" width="20" height="60"/>
    
    <!-- Custom House dome suggestion -->
    <path d="M 580,480 Q 600,420 620,480 Z"/>
    <ellipse cx="600" cy="440" rx="25" ry="15" fill="#0d1117"/>
    
    <!-- Liberty Hall / modern towers -->
    <rect x="720" y="380" width="35" height="100"/>
    <rect x="765" y="400" width="30" height="80"/>
    <rect x="805" y="360" width="40" height="120"/>
    
    <!-- Crane at docklands -->
    <g transform="translate(980, 340)">
      <rect x="0" y="0" width="8" height="140" fill="#1a1f2e"/>
      <rect x="-25" y="0" width="60" height="8" fill="#1a1f2e"/>
      <rect x="30" y="0" width="8" height="80" fill="#1a1f2e"/>
      <path d="M 30,0 L 38,80" stroke="#1a1f2e" stroke-width="3" fill="none"/>
      <path d="M 0,0 L -20,60" stroke="#1a1f2e" stroke-width="3" fill="none"/>
    </g>
    
    <!-- Another spire -->
    <path d="M 1080,480 L 1075,410 L 1085,410 L 1080,395 L 1075,410 L 1085,410 Z"/>
    <rect x="1070" y="440" width="20" height="40"/>
  </g>
  
  <!-- Reflections in water -->
  <g opacity="0.15" transform="translate(0, 480) scale(1, -0.4)">
    <path d="M 280,0 L 275,100 L 285,100 L 280,120 L 275,100 L 285,100 Z" fill="#58a6ff"/>
    <rect x="270" y="60" width="20" height="60" fill="#58a6ff"/>
    <path d="M 600,0 Q 620,60 600,120 Z" fill="#a371f7"/>
    <rect x="720" y="20" width="35" height="100" fill="#58a6ff"/>
    <rect x="980,0" width="8" height="140" fill="#a371f7"/>
  </g>
  
  <!-- Subtle grid/lines suggesting the city structure -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="180" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="0.5px">
    The City Remembers
  </text>
  
  <text x="600" y="235" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" 
        font-weight="400" 
        fill="#8b949e" 
        text-anchor="middle"
        letter-spacing="0.3px">
    What the Rain Forgets
  </text>
  
  <!-- Date/category line -->
  <text x="600" y="300" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="400" 
        fill="#58a6ff" 
        text-anchor="middle"
        letter-spacing="1px">
    4 September 2026  •  James Joyce  •  Daily Observations
  </text>
  
  <!-- Decorative divider -->
  <g stroke="#58a6ff" stroke-width="1.5" opacity="0.6">
    <line x1="500" y1="320" x2="700" y2="320"/>
    <circle cx="600" cy="320" r="3" fill="#58a6ff"/>
  </g>
  
  <!-- Subtle rain drops -->
  <g fill="#58a6ff" opacity="0.3">
    <circle cx="180" cy="180" r="1.5"/>
    <circle cx="420" cy="120" r="1"/>
    <circle cx="780" cy="90" r="1.5"/>
    <circle cx="1020" cy="160" r="1"/>
    <circle cx="300" cy="280" r="1"/>
    <circle cx="900" cy="250" r="1.5"/>
    <circle cx="1100" cy="100" r="1"/>
    <circle cx="550" cy="50" r="1.5"/>
  </g>
</svg>