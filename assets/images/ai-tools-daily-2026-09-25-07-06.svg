<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c9d1d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="150" cy="150" r="40" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="1050" cy="480" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Accent lines -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="900" y1="430" x2="1100" y2="430" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Small decorative dots -->
  <circle cx="200" cy="300" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="220" cy="310" r="2" fill="#a371f7" opacity="0.4"/>
  <circle cx="180" cy="320" r="2" fill="#f78166" opacity="0.4"/>
  <circle cx="1000" cy="350" r="3" fill="#a371f7" opacity="0.4"/>
  <circle cx="980" cy="365" r="2" fill="#58a6ff" opacity="0.4"/>
  <circle cx="1020" cy="370" r="2" fill="#3fb950" opacity="0.4"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle">AI Tools Daily</text>
  
  <!-- Date -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">September 25, 2026</text>
  
  <!-- Category tags -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">OpenCode 2.0 · Claude Tag On-Call · Cursor Rollouts · JetBrains Air · S1Code</text>
  
  <!-- Subtitle -->
  <text x="600" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Five new tools and notable updates since last week</text>
  
  <!-- Bottom accent -->
  <line x1="400" y1="520" x2="800" y2="520" stroke="url(#accentGrad)" stroke-width="1" opacity="0.6"/>
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">coetzeer.github.io/jekyll-theme-kactus</text>
</svg>