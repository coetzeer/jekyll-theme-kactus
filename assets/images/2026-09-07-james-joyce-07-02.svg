<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#a371f7;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.12" />
      <stop offset="60%" style="stop-color:#a371f7;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric glow -->
  <ellipse cx="600" cy="180" rx="500" ry="200" fill="url(#glowGradient)"/>
  
  <!-- Light beams breaking through clouds -->
  <g opacity="0.06">
    <polygon points="600,0 550,200 650,200" fill="#58a6ff"/>
    <polygon points="600,0 530,250 670,250" fill="#a371f7"/>
    <polygon points="600,0 500,300 700,300" fill="#58a6ff"/>
  </g>
  
  <!-- Cloud layers - back layer -->
  <g fill="#1a1d2e" opacity="0.8">
    <ellipse cx="200" cy="120" rx="180" ry="50"/>
    <ellipse cx="500" cy="80" rx="220" ry="40"/>
    <ellipse cx="900" cy="140" rx="160" ry="45"/>
    <ellipse cx="1100" cy="60" rx="120" ry="35"/>
  </g>
  
  <!-- Cloud layers - mid layer -->
  <g fill="#151822" opacity="0.9">
    <ellipse cx="100" cy="180" rx="140" ry="40"/>
    <ellipse cx="400" cy="160" rx="200" ry="50"/>
    <ellipse cx="700" cy="200" rx="180" ry="45"/>
    <ellipse cx="1050" cy="170" rx="150" ry="40"/>
  </g>
  
  <!-- Cloud layers - front layer (darker, more defined) -->
  <g fill="#0d1117" opacity="1">
    <ellipse cx="50" cy="250" rx="120" ry="35"/>
    <ellipse cx="350" cy="280" rx="160" ry="50"/>
    <ellipse cx="650" cy="260" rx="200" ry="55"/>
    <ellipse cx="950" cy="290" rx="140" ry="40"/>
    <ellipse cx="1150" cy="240" rx="100" ry="30"/>
  </g>
  
  <!-- Subtle grid lines for texture -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>
  
  <!-- Horizon line suggestion -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  
  <!-- Streetlamp glow suggestions -->
  <g fill="#f78166" opacity="0.15">
    <ellipse cx="150" cy="450" rx="40" ry="60"/>
    <ellipse cx="1050" cy="460" rx="35" ry="55"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">The Light Falls</text>
  <text x="600" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">Over Croke Park</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">September 7, 2026 — Dublin Morning</text>
  
  <!-- Decorative line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="#30363d" stroke-width="1" opacity="0.6"/>
  <line x1="550" y1="420" x2="650" y2="420" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
  
  <!-- Small geometric accents -->
  <g fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3">
    <circle cx="300" cy="500" r="30"/>
    <circle cx="900" cy="500" r="30"/>
  </g>
  <g fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2">
    <circle cx="300" cy="500" r="45"/>
    <circle cx="900" cy="500" r="45"/>
  </g>
  
  <!-- Bottom texture - subtle wave -->
  <path d="M0,630 Q300,580 600,630 T1200,630" fill="#0a0d12" opacity="0.8"/>
</svg>