<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric decoration -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="120" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1100" cy="530" r="150" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="530" r="100" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Accent line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    Nine Degrees and the Weight of Things
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" font-weight="400">
    A Dublin Morning — November 20, 2026
  </text>
  
  <!-- Category tag -->
  <text x="600" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="500" letter-spacing="1px">
    JAMES JOYCE · DAILY OBSERVATIONS
  </text>
  
  <!-- Decorative dots -->
  <circle cx="550" cy="445" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="445" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="650" cy="445" r="2" fill="#f78166" opacity="0.6"/>
  
  <!-- Bottom accent -->
  <line x1="500" y1="500" x2="700" y2="500" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  
  <!-- Date -->
  <text x="600" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6e7681" text-anchor="middle" font-weight="400">
    07:02 CET · Overcast · 9.7°C
  </text>
</svg>