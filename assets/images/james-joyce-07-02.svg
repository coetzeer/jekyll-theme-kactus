<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Drizzle lines - subtle rain effect -->
  <g stroke="#30363d" stroke-width="0.8" opacity="0.4">
    <line x1="100" y1="50" x2="110" y2="80"/>
    <line x1="250" y1="30" x2="260" y2="60"/>
    <line x1="400" y1="70" x2="410" y2="100"/>
    <line x1="550" y1="20" x2="560" y2="50"/>
    <line x1="700" y1="60" x2="710" y2="90"/>
    <line x1="850" y1="40" x2="860" y2="70"/>
    <line x1="1000" y1="80" x2="1010" y2="110"/>
    <line x1="1150" y1="10" x2="1160" y2="40"/>
    <line x1="80" y1="150" x2="90" y2="180"/>
    <line x1="300" y1="120" x2="310" y2="150"/>
    <line x1="600" y1="180" x2="610" y2="210"/>
    <line x1="950" y1="140" x2="960" y2="170"/>
  </g>

  <!-- Decorative accent line -->
  <line x1="150" y1="500" x2="1050" y2="500" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Category label -->
  <text x="150" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8b949e" letter-spacing="0.5px">
    JAMES JOYCE  •  DAILY OBSERVATIONS
  </text>

  <!-- Date -->
  <text x="150" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6e7681">
    23 November 2026  •  07:02 CET
  </text>

  <!-- Title - multi-line -->
  <text x="150" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#titleGrad)" line-height="1.2">
    <tspan x="150" dy="0">The Light at Eight-Five,</tspan>
    <tspan x="150" dy="58">The Weight of December</tspan>
  </text>

  <!-- Subtitle / description -->
  <text x="150" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" opacity="0.9">
    A November morning in Dublin — light drizzle, the Christmas Bonus coming,
  </text>
  <text x="150" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" opacity="0.9">
    a gun in Inchicore, a lottery ticket in Waterford, and the city breathing through it all.
  </text>

  <!-- Bottom decorative elements -->
  <circle cx="1100" cy="550" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="550" r="50" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  <circle cx="100" cy="80" r="60" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="80" r="35" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>

  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.6">
    <circle cx="150" cy="495" r="3"/>
    <circle cx="300" cy="495" r="2"/>
    <circle cx="450" cy="495" r="3"/>
    <circle cx="600" cy="495" r="2"/>
    <circle cx="750" cy="495" r="3"/>
    <circle cx="900" cy="495" r="2"/>
    <circle cx="1050" cy="495" r="3"/>
  </g>

  <g fill="#a371f7" opacity="0.5">
    <circle cx="225" cy="495" r="1.5"/>
    <circle cx="375" cy="495" r="1.5"/>
    <circle cx="525" cy="495" r="1.5"/>
    <circle cx="675" cy="495" r="1.5"/>
    <circle cx="825" cy="495" r="1.5"/>
    <circle cx="975" cy="495" r="1.5"/>
  </g>
</svg>