<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="40%" style="stop-color:#58a6ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Atmospheric glow -->
  <ellipse cx="600" cy="180" rx="500" ry="200" fill="url(#glowGradient)"/>
  
  <!-- Light rays from top -->
  <g fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.3">
    <line x1="300" y1="0" x2="280" y2="200"/>
    <line x1="400" y1="0" x2="390" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="230"/>
    <line x1="700" y1="0" x2="700" y2="220"/>
    <line x1="800" y1="0" x2="810" y2="200"/>
    <line x1="900" y1="0" x2="920" y2="200"/>
  </g>
  
  <!-- Distant city silhouette -->
  <g fill="#161b22">
    <!-- Cranes -->
    <g transform="translate(150, 350)">
      <rect x="0" y="0" width="4" height="180" fill="#21262d"/>
      <rect x="-15" y="0" width="34" height="6" fill="#21262d"/>
      <rect x="-15" y="20" width="34" height="3" fill="#21262d"/>
      <line x1="-15" y1="0" x2="-15" y2="180" stroke="#30363d" stroke-width="1"/>
      <line x1="19" y1="0" x2="19" y2="180" stroke="#30363d" stroke-width="1"/>
    </g>
    <g transform="translate(300, 350)">
      <rect x="0" y="0" width="4" height="200" fill="#21262d"/>
      <rect x="-15" y="0" width="34" height="6" fill="#21262d"/>
      <rect x="-15" y="25" width="34" height="3" fill="#21262d"/>
    </g>
    <g transform="translate(900, 350)">
      <rect x="0" y="0" width="4" height="160" fill="#21262d"/>
      <rect x="-15" y="0" width="34" height="6" fill="#21262d"/>
      <rect x="-15" y="15" width="34" height="3" fill="#21262d"/>
    </g>
    <g transform="translate(1050, 350)">
      <rect x="0" y="0" width="4" height="190" fill="#21262d"/>
      <rect x="-15" y="0" width="34" height="6" fill="#21262d"/>
    </g>
    
    <!-- Buildings -->
    <rect x="50" y="420" width="80" height="150" fill="#161b22"/>
    <rect x="100" y="400" width="4" height="170" fill="#30363d"/>
    <rect x="180" y="440" width="60" height="130" fill="#161b22"/>
    <rect x="380" y="410" width="100" height="160" fill="#161b22"/>
    <rect x="420" y="380" width="20" height="190" fill="#21262d"/>
    <rect x="600" y="430" width="80" height="140" fill="#161b22"/>
    <rect x="700" y="400" width="70" height="170" fill="#161b22"/>
    <rect x="720" y="370" width="30" height="200" fill="#21262d"/>
    <rect x="850" y="450" width="50" height="120" fill="#161b22"/>
    <rect x="950" y="420" width="90" height="150" fill="#161b22"/>
  </g>
  
  <!-- River/Liffey reflection -->
  <g opacity="0.4">
    <path d="M0,520 Q300,500 600,520 Q900,540 1200,520 L1200,630 L0,630 Z" fill="#0d1117"/>
    <path d="M0,520 Q300,500 600,520 Q900,540 1200,520" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Light reflection on water -->
  <ellipse cx="600" cy="550" rx="300" ry="30" fill="url(#lightGradient)"/>
  
  <!-- Title text -->
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="0.5px">
    The light in Malahide
  </text>
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="0.5px">
    the gun in Finglas
  </text>
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="0.5px">
    the queue in Santry
  </text>
  
  <!-- Divider line -->
  <line x1="450" y1="350" x2="750" y2="350" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtitle/category -->
  <text x="600" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">
    James Joyce · Daily Observations · 11 September 2026
  </text>
  
  <!-- Decorative elements - subtle geometric accents -->
  <g stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="200" cy="150" r="60" stroke-dasharray="20,40"/>
    <circle cx="1000" cy="150" r="80" stroke-dasharray="30,60"/>
    <rect x="100" y="500" width="2" height="60" opacity="0.3"/>
    <rect x="1100" y="500" width="2" height="80" opacity="0.3"/>
  </g>
  
  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.5">
    <circle cx="350" cy="180" r="2"/>
    <circle cx="850" cy="180" r="2"/>
    <circle cx="280" cy="480" r="1.5"/>
    <circle cx="920" cy="480" r="1.5"/>
    <circle cx="500" cy="580" r="1"/>
    <circle cx="700" cy="580" r="1"/>
  </g>
</svg>
