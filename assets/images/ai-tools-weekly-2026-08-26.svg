<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6edf3;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="url(#accent-gradient)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="80" fill="url(#accent-gradient)" opacity="0.06" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="3" fill="#58a6ff" opacity="0.4">
    <animate attributeName="r" values="3;15;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Accent lines -->
  <line x1="80" y1="80" x2="280" y2="80" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="80" x2="80" y2="180" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.6"/>
  <line x1="1120" y1="550" x2="920" y2="550" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.6"/>
  <line x1="1120" y1="550" x2="1120" y2="450" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Main title -->
  <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#title-gradient)">
    This Week in AI Tools
  </text>
  
  <!-- Date -->
  <text x="600" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">
    August 26, 2026
  </text>
  
  <!-- Subtitle tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="600" y="340" fill="#58a6ff">Qwen3.8 • Mobile-MCP • NeMo Switchyard</text>
    <text x="600" y="370" fill="#a371f7">SpaceX/Cursor • Claude Code Auto • Origin Beta</text>
  </g>
  
  <!-- Category badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
    <!-- Open Source badge -->
    <rect x="420" y="420" width="140" height="32" rx="16" fill="#3fb950" opacity="0.2" stroke="#3fb950" stroke-width="1"/>
    <text x="490" y="442" text-anchor="middle" fill="#3fb950">Open Source</text>
    
    <!-- Coding Agents badge -->
    <rect x="580" y="420" width="150" height="32" rx="16" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="655" y="442" text-anchor="middle" fill="#58a6ff">Coding Agents</text>
    
    <!-- Infrastructure badge -->
    <rect x="750" y="420" width="130" height="32" rx="16" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="1"/>
    <text x="815" y="442" text-anchor="middle" fill="#a371f7">Infrastructure</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="520" x2="800" y2="520" stroke="url(#accent-gradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Source attribution -->
  <text x="600" y="570" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#484f58">
    r/AI • r/MachineLearning • Reddit LocalLLaMA • NVIDIA Developer Blog • InfoQ
  </text>
</svg>