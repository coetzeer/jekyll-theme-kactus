<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080c11;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="riverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture -->
  <g opacity="0.03">
    <circle cx="200" cy="150" r="300" fill="#58a6ff"/>
    <circle cx="1000" cy="480" r="250" fill="#a371f7"/>
    <circle cx="600" cy="315" r="400" fill="#f78166"/>
  </g>
  
  <!-- River silhouette at bottom -->
  <path d="M0,480 Q300,460 600,485 T1200,510 L1200,630 L0,630 Z" fill="url(#riverGradient)" opacity="0.6"/>
  
  <!-- Weir-like geometric barriers in river -->
  <g fill="#30363d" opacity="0.4">
    <rect x="150" y="485" width="4" height="80" rx="2"/>
    <rect x="300" y="488" width="4" height="75" rx="2"/>
    <rect x="450" y="482" width="4" height="85" rx="2"/>
    <rect x="600" y="490" width="4" height="70" rx="2"/>
    <rect x="750" y="485" width="4" height="80" rx="2"/>
    <rect x="900" y="488" width="4" height="75" rx="2"/>
    <rect x="1050" y="482" width="4" height="85" rx="2"/>
  </g>
  
  <!-- Rain/speckles -->
  <g fill="#58a6ff" opacity="0.15">
    <circle cx="100" cy="100" r="1"/>
    <circle cx="250" cy="80" r="0.5"/>
    <circle cx="400" cy="120" r="1"/>
    <circle cx="550" cy="60" r="0.5"/>
    <circle cx="700" cy="110" r="1"/>
    <circle cx="850" cy="90" r="0.5"/>
    <circle cx="1000" cy="130" r="1"/>
    <circle cx="1150" cy="70" r="0.5"/>
    <circle cx="180" cy="200" r="1"/>
    <circle cx="350" cy="180" r="0.5"/>
    <circle cx="520" cy="220" r="1"/>
    <circle cx="680" cy="190" r="0.5"/>
    <circle cx="820" cy="210" r="1"/>
    <circle cx="980" cy="185" r="0.5"/>
    <circle cx="1120" cy="200" r="1"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Salmon, The Triangle,
  </text>
  <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Aquaplane
  </text>
  
  <!-- Subtitle line -->
  <line x1="400" y1="300" x2="800" y2="300" stroke="url(#accentGradient)" stroke-width="1.5"/>
  
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="22" fill="#8b949e" text-anchor="middle" font-weight="400">
    A November Morning on the Liffey
  </text>
  
  <!-- Date -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#6a737d" text-anchor="middle" font-weight="400">
    21 November 2026 • 07:01 CET
  </text>
  
  <!-- Decorative element - subtle wave -->
  <path d="M300,420 Q450,400 600,420 T900,420" stroke="#30363d" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Author -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#484f58" text-anchor="middle" font-weight="500">
    James Joyce — Daily Observations
  </text>
</svg>