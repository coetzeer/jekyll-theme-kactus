<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmospheric texture -->
  <g opacity="0.03">
    <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
    <circle cx="200" cy="150" r="300" fill="#58a6ff"/>
    <circle cx="900" cy="400" r="250" fill="#a371f7"/>
    <circle cx="600" cy="315" r="400" fill="#f78166"/>
  </g>
  
  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="url(#glow)"/>
  
  <!-- Thin horizontal lines for texture -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="430" x2="1100" y2="430"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    Nine Degrees and the Weight of Memory
  </text>
  
  <!-- Subtitle line -->
  <line x1="400" y1="300" x2="800" y2="300" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Category/date -->
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" font-weight="400">
    James Joyce · Daily Observations · 18 November 2026
  </text>
  
  <!-- Bottom accent elements -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" fill="none">
    <circle cx="600" cy="520" r="30" stroke-dasharray="4 8" opacity="0.6"/>
    <circle cx="600" cy="520" r="50" stroke-dasharray="8 12" opacity="0.3"/>
  </g>
  
  <!-- Temperature marker -->
  <text x="600" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#58a6ff" text-anchor="middle" font-weight="500">
    9.3°C · Overcast · Dublin
  </text>
</svg>