<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle geometric decoration -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <rect x="50" y="500" width="200" height="1" fill="url(#accentGrad)"/>
  <rect x="950" y="80" width="180" height="1" fill="url(#accentGrad)"/>

  <!-- Decorative wave line - evoking the Liffey -->
  <path d="M 0 315 Q 300 290 600 315 T 1200 315" fill="none" stroke="#f78166" stroke-width="1" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" dominant-baseline="middle">The Liffey Remembers</text>

  <!-- Subtitle -->
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">Daily observations & epiphanies</text>

  <!-- Date line -->
  <text x="600" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#f78166" text-anchor="middle" dominant-baseline="middle">24 August 2026</text>

  <!-- Small decorative elements -->
  <circle cx="580" cy="415" r="3" fill="#f78166" opacity="0.6"/>
  <circle cx="620" cy="415" r="3" fill="#f78166" opacity="0.6"/>
  <circle cx="600" cy="430" r="2" fill="#f78166" opacity="0.4"/>

  <!-- Subtle bridge cables suggestion -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="100" x2="200" y2="250"/>
    <line x1="300" y1="80" x2="300" y2="250"/>
    <line x1="400" y1="70" x2="400" y2="250"/>
    <line x1="500" y1="65" x2="500" y2="250"/>
    <line x1="700" y1="65" x2="700" y2="250"/>
    <line x1="800" y1="70" x2="800" y2="250"/>
    <line x1="900" y1="80" x2="900" y2="250"/>
    <line x1="1000" y1="100" x2="1000" y2="250"/>
  </g>
</svg>