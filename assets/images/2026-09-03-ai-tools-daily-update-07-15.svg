<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d1d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="url(#accentGrad)" opacity="0.08"/>
  <circle cx="1050" cy="480" r="120" fill="url(#accentGrad)" opacity="0.06"/>
  <circle cx="1100" cy="100" r="60" fill="#58a6ff" opacity="0.1"/>
  <circle cx="100" cy="530" r="40" fill="#a371f7" opacity="0.1"/>

  <!-- Top accent line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">AI Tools Daily Update</text>

  <!-- Date -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">September 3, 2026</text>

  <!-- Subtitle / tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff">Gemini 3.8 Flash & Cyber, Anthropic Fable 5.1, OrcaReplay, SignalHandy</text>

  <!-- Bottom accent line -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Tags/icons row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">
    <text x="300" y="580">🤖 Models</text>
    <text x="600" y="580">🔧 Agent Infra</text>
    <text x="900" y="580">📊 Social Intel</text>
  </g>
</svg>