<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Subtle light pool -->
  <ellipse cx="600" cy="180" rx="500" ry="200" fill="url(#lightPool)"/>
  
  <!-- Thin horizontal lines for texture -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="150" x2="1100" y2="150"/>
    <line x1="100" y1="480" x2="1100" y2="480"/>
  </g>
  
  <!-- Decorative geometric elements -->
  <g fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4">
    <circle cx="200" cy="200" r="80"/>
    <circle cx="1000" cy="430" r="120"/>
    <rect x="150" y="400" width="60" height="60" transform="rotate(15 180 430)"/>
  </g>
  
  <!-- Accent line -->
  <line x1="300" y1="310" x2="900" y2="310" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Weight of November Light
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.5px">
    10 November 2026 • Dublin • 9.8°C • Overcast
  </text>
  
  <!-- Category tags -->
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#58a6ff" text-anchor="middle" opacity="0.8">
    james-joyce  •  daily-observations
  </text>
  
  <!-- Bottom decorative wave -->
  <path d="M 100 550 Q 300 520 500 550 T 900 550 T 1100 550" 
        fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  
  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.5">
    <circle cx="450" cy="310" r="3"/>
    <circle cx="750" cy="310" r="3"/>
    <circle cx="600" cy="295" r="2"/>
    <circle cx="600" cy="325" r="2"/>
  </g>
</svg>