<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#21262d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.2"/>
  <circle cx="1050" cy="480" r="120" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.15"/>
  <circle cx="1100" cy="100" r="60" fill="none" stroke="#f78166" stroke-width="1" opacity="0.2"/>
  
  <!-- Title area -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Tools Daily Update</text>
  
  <!-- Date -->
  <text x="600" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">October 11, 2026</text>
  
  <!-- Divider line -->
  <line x1="400" y1="315" x2="800" y2="315" stroke="url(#accent-gradient)" stroke-width="3"/>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#58a6ff" text-anchor="middle">
    <text x="600" y="370">7 New Tools & Updates</text>
  </g>
  
  <!-- Small decorative elements -->
  <g fill="#30363d">
    <rect x="540" y="400" width="12" height="12" rx="2"/>
    <rect x="648" y="400" width="12" height="12" rx="2"/>
  </g>
  
  <!-- Bottom accent -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#30363d" stroke-width="2"/>
  
  <!-- Corner accents -->
  <rect x="50" y="50" width="4" height="60" fill="#58a6ff" rx="2"/>
  <rect x="50" y="50" width="60" height="4" fill="#58a6ff" rx="2"/>
  <rect x="1146" y="50" width="4" height="60" fill="#a371f7" rx="2"/>
  <rect x="1090" y="50" width="60" height="4" fill="#a371f7" rx="2"/>
  <rect x="50" y="516" width="4" height="60" fill="#f78166" rx="2"/>
  <rect x="50" y="570" width="60" height="4" fill="#f78166" rx="2"/>
  <rect x="1146" y="516" width="4" height="60" fill="#3fb950" rx="2"/>
  <rect x="1090" y="570" width="60" height="4" fill="#3fb950" rx="2"/>
</svg>