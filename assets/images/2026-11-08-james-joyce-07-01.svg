<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="#30363d" stroke-width="1" opacity="0.2"/>
  <rect x="50" y="500" width="200" height="1" fill="#30363d" opacity="0.3"/>
  <rect x="950" y="100" width="1" height="150" fill="#30363d" opacity="0.3"/>
  
  <!-- Decorative line with gradient -->
  <line x1="100" y1="200" x2="400" y2="200" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="800" y1="430" x2="1100" y2="430" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Small accent circles -->
  <circle cx="200" cy="200" r="3" fill="#58a6ff" opacity="0.7"/>
  <circle cx="300" cy="200" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="900" cy="430" r="2" fill="#58a6ff" opacity="0.5"/>
  <circle cx="1000" cy="430" r="1.5" fill="#a371f7" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5px">
    The Light That Failed to Arrive
  </text>
  
  <!-- Subtitle/category -->
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="24" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    Dublin · November 8, 2026 · 7.4°C Overcast
  </text>
  
  <!-- Author line -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="18" fill="#58a6ff" text-anchor="middle" font-style="italic">
    James Joyce · Daily Observations
  </text>
  
  <!-- Bottom decorative wave -->
  <path d="M0,580 Q300,550 600,580 T1200,580" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
  
  <!-- Fog-like subtle texture -->
  <g opacity="0.03">
    <ellipse cx="200" cy="150" rx="150" ry="80" fill="#58a6ff"/>
    <ellipse cx="900" cy="450" rx="200" ry="100" fill="#a371f7"/>
    <ellipse cx="600" cy="350" rx="300" ry="150" fill="#ffffff"/>
  </g>
</svg>