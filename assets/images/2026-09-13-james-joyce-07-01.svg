<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#f78166"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%" fx="20%" fy="30%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%" fx="80%" fy="70%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle atmospheric glows -->
  <ellipse cx="240" cy="189" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="960" cy="441" rx="350" ry="250" fill="url(#glow2)"/>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Light rays from top - overcast light -->
  <g opacity="0.04">
    <line x1="100" y1="0" x2="120" y2="630" stroke="#ffffff" stroke-width="2"/>
    <line x1="300" y1="0" x2="320" y2="630" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="510" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="720" y2="630" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="900" y1="0" x2="915" y2="630" stroke="#ffffff" stroke-width="2"/>
    <line x1="1100" y1="0" x2="1110" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Central horizontal band - the "overcast" layer -->
  <rect x="120" y="220" width="960" height="190" fill="url(#lightGrad)" rx="2"/>

  <!-- Title text -->
  <text x="600" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Light That Falls on Overcast Dublin
  </text>

  <!-- Subtitle/category -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="22" fill="#8b949e" text-anchor="middle" letter-spacing="0.3px">
    James Joyce — Daily Observations · 13 September 2026 · 17.3°C
  </text>

  <!-- Decorative separator -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="450" y1="380" x2="530" y2="380"/>
    <line x1="670" y1="380" x2="750" y2="380"/>
  </g>
  <circle cx="600" cy="380" r="3" fill="#58a6ff"/>

  <!-- Bottom accent line -->
  <line x1="0" y1="630" x2="1200" y2="630" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Subtle geometric elements - circles suggesting raindrops/atoms -->
  <g fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <circle cx="150" cy="150" r="40"/>
    <circle cx="1050" cy="180" r="25"/>
    <circle cx="180" cy="500" r="30"/>
    <circle cx="1020" cy="480" r="35"/>
  </g>
  <g fill="#58a6ff" opacity="0.15">
    <circle cx="150" cy="150" r="8"/>
    <circle cx="1050" cy="180" r="5"/>
    <circle cx="180" cy="500" r="6"/>
    <circle cx="1020" cy="480" r="7"/>
  </g>

  <!-- Small Dublin coordinates watermark -->
  <text x="1150" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="11" fill="#30363d" text-anchor="end">
    53.3498° N, 6.2603° W
  </text>
</svg>