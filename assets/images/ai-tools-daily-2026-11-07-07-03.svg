<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa657;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <circle cx="600" cy="315" r="200" fill="none"/>
    <circle cx="600" cy="315" r="150" fill="none"/>
    <circle cx="600" cy="315" r="100" fill="none"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1050" cy="480" r="120" fill="url(#coralGrad)" opacity="0.1"/>
  <circle cx="300" cy="500" r="60" fill="#58a6ff" opacity="0.08"/>
  <circle cx="900" cy="130" r="90" fill="#a371f7" opacity="0.08"/>
  
  <!-- Thin accent lines -->
  <g stroke="url(#accentGrad)" stroke-width="2" opacity="0.4">
    <line x1="100" y1="100" x2="200" y2="100"/>
    <line x1="1000" y1="530" x2="1100" y2="530"/>
  </g>
  <g stroke="url(#coralGrad)" stroke-width="2" opacity="0.4">
    <line x1="100" y1="200" x2="180" y2="200"/>
    <line x1="1020" y1="430" x2="1100" y2="430"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Tools Daily</text>
  
  <!-- Date -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">November 7, 2026</text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="450" y="350" width="100" height="30" rx="15" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
    <text x="500" y="372" fill="#58a6ff">GPT-6 Cyber</text>
    
    <rect x="560" y="350" width="120" height="30" rx="15" fill="#30363d" stroke="#a371f7" stroke-width="1"/>
    <text x="620" y="372" fill="#a371f7">Conductor→Meta</text>
    
    <rect x="690" y="350" width="80" height="30" rx="15" fill="#30363d" stroke="#3fb950" stroke-width="1"/>
    <text x="730" y="372" fill="#3fb950">Tencent Hy4</text>
    
    <rect x="780" y="350" width="90" height="30" rx="15" fill="#30363d" stroke="#f78166" stroke-width="1"/>
    <text x="825" y="372" fill="#f78166">Mistral Studio</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="430" x2="800" y2="430" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5"/>
  
  <!-- Subtitle -->
  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">Six new tools and updates since yesterday</text>
  
  <!-- Corner marks -->
  <g stroke="#30363d" stroke-width="1">
    <path d="M 50 50 L 100 50 M 50 50 L 50 100"/>
    <path d="M 1150 50 L 1100 50 M 1150 50 L 1150 100"/>
    <path d="M 50 580 L 100 580 M 50 580 L 50 530"/>
    <path d="M 1150 580 L 1100 580 M 1150 580 L 1150 530"/>
  </g>
</svg>