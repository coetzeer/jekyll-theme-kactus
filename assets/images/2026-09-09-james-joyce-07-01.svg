<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#58a6ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:1" />
    </accentGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Subtle atmospheric light beam -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#lightGradient)"/>

  <!-- Decorative geometric elements - thin lines -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.4">
    <line x1="100" y1="150" x2="300" y2="150"/>
    <line x1="900" y1="150" x2="1100" y2="150"/>
    <line x1="100" y1="480" x2="250" y2="480"/>
    <line x1="950" y1="480" x2="1100" y2="480"/>
  </g>

  <!-- Small circles for texture -->
  <g fill="#30363d" opacity="0.3">
    <circle cx="150" cy="100" r="2"/>
    <circle cx="1050" cy="100" r="2"/>
    <circle cx="200" cy="530" r="1.5"/>
    <circle cx="1000" cy="530" r="1.5"/>
    <circle cx="600" cy="80" r="1"/>
    <circle cx="600" cy="550" r="1"/>
  </g>

  <!-- Accent line across center -->
  <line x1="300" y1="315" x2="900" y2="315" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>

  <!-- Title text -->
  <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">The Light on College Green</text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle" font-weight="400">James Joyce — Daily Observations</text>

  <!-- Date -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="middle">September 9, 2026</text>

  <!-- Bottom accent elements -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 400 520 Q 600 490 800 520"/>
    <path d="M 450 560 Q 600 540 750 560"/>
  </g>

  <!-- Small decorative triangles -->
  <g fill="#58a6ff" opacity="0.4">
    <polygon points="590,420 600,405 610,420"/>
    <polygon points="570,430 580,415 590,430" opacity="0.3"/>
    <polygon points="610,430 620,415 630,430" opacity="0.3"/>
  </g>
</svg>