<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0.6"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>
  
  <!-- Subtle geometric decoration -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1050" cy="480" r="60" fill="none" stroke="#30363d" stroke-width="1" opacity="0.3"/>
  <circle cx="1050" cy="480" r="100" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Horizontal accent lines -->
  <line x1="200" y1="280" x2="1000" y2="280" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="350" x2="1000" y2="350" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Title -->
  <text x="600" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    The Weight of Wednesday Morning
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="22" fill="#8b949e" text-anchor="middle" font-weight="400">
    14.6°C · Overcast · Banagher · September 30, 2026
  </text>
  
  <!-- Category line -->
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="500" letter-spacing="1px">
    JAMES JOYCE · DAILY OBSERVATIONS
  </text>
  
  <!-- Decorative dots -->
  <circle cx="560" cy="415" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="600" cy="415" r="2" fill="#a371f7" opacity="0.6"/>
  <circle cx="640" cy="415" r="2" fill="#f78166" opacity="0.6"/>
  
  <!-- Bottom accent -->
  <line x1="500" y1="450" x2="700" y2="450" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
</svg>