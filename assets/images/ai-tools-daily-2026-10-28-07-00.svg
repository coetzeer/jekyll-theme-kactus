<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7a866;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="530" r="120" fill="none" stroke="url(#coralGrad)" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="550" r="60" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.1"/>
  <circle cx="1050" cy="80" r="90" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.1"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
  
  <!-- Main title -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">AI Tools Daily</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">October 28, 2026</text>
  
  <!-- Category tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#58a6ff">
    <text x="600" y="400" text-anchor="middle" fill="#58a6ff">Agent Tree  •  Microsoft Agensh  •  iFlytek Spark-X2.6  •  Cursor Agent SDK</text>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#coralGrad)"/>
  
  <!-- Decorative line -->
  <line x1="400" y1="360" x2="800" y2="360" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
</svg>
