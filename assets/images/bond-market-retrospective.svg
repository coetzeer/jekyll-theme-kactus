<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Decorative circuit lines -->
  <g stroke="url(#lineGradient)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 50,580 Q 300,400 600,500 Q 900,600 1150,550" filter="url(#glow)"/>
    <path d="M 100,520 Q 350,350 650,450 Q 950,550 1180,500" stroke-dasharray="8,4" opacity="0.3"/>
    <path d="M 0,450 Q 250,280 550,380 Q 850,480 1200,420" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Yield curve chart representation -->
  <g transform="translate(100, 150)" opacity="0.6">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#30363d" stroke-width="1.5"/>
    <line x1="0" y1="300" x2="450" y2="300" stroke="#30363d" stroke-width="1.5"/>

    <!-- Yield curves for US, UK, Germany -->
    <path d="M 0,250 Q 100,200 200,180 Q 300,160 450,140" stroke="#f78166" stroke-width="2.5" fill="none" filter="url(#glow)"/>
    <path d="M 0,280 Q 100,240 200,210 Q 300,190 450,170" stroke="#ffcc00" stroke-width="2.5" fill="none" filter="url(#glow)"/>
    <path d="M 0,220 Q 100,180 200,150 Q 300,130 450,110" stroke="#58a6ff" stroke-width="2.5" fill="none" filter="url(#glow)"/>

    <!-- Labels on curves -->
    <text x="460" y="135" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#f78166" font-weight="600">US 10Y 4.64%</text>
    <text x="460" y="165" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#ffcc00" font-weight="600">UK 10Y 5.00%</text>
    <text x="460" y="105" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#58a6ff" font-weight="600">DE 10Y 3.25%</text>
  </g>

  <!-- Main title -->
  <text x="600" y="120" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="36" font-weight="700" fill="#e6edf3" filter="url(#textGlow)">
    BOND MARKET RETROSPECTIVE
  </text>

  <!-- Subtitle -->
  <text x="600" y="160" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="16" fill="#8b949e">
    Two-Day Yield Movement Across US, UK & Europe · 20 Aug 2026
  </text>

  <!-- Key metrics boxes -->
  <g font-family="JetBrains Mono, Fira Code, monospace">
    <!-- US Box -->
    <g transform="translate(120, 480)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
      <text x="110" y="28" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">US TREASURIES</text>
      <text x="110" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#f78166">4.64%</text>
      <text x="110" y="82" text-anchor="middle" font-size="10" fill="#58a6ff">10Y Yield · -1bp MoM</text>
    </g>

    <!-- UK Box -->
    <g transform="translate(380, 480)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
      <text x="110" y="28" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">UK GILTS</text>
      <text x="110" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#ffcc00">5.00%</text>
      <text x="110" y="82" text-anchor="middle" font-size="10" fill="#58a6ff">10Y Yield · -8bp MoM</text>
    </g>

    <!-- Germany Box -->
    <g transform="translate(640, 480)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
      <text x="110" y="28" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">GERMAN BUNDS</text>
      <text x="110" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#58a6ff">3.25%</text>
      <text x="110" y="82" text-anchor="middle" font-size="10" fill="#58a6ff">10Y Yield · +8bp MoM</text>
    </g>

    <!-- Spread Box -->
    <g transform="translate(900, 480)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
      <text x="110" y="28" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">PERIPHERY SPREADS</text>
      <text x="110" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#ffcc00">FR 85bp · IT 79bp</text>
      <text x="110" y="82" text-anchor="middle" font-size="10" fill="#58a6ff">vs Bund · Elevated</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="100" y1="610" x2="1100" y2="610" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
</svg>